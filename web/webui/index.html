<style>
:root{
  --bg:#070A13; --bg2:#0B0F1A; --side:#0A0E19; --panel:rgba(20,27,45,.66); --solid:#111829;
  --line:rgba(132,153,204,.14); --line2:rgba(132,153,204,.26);
  --text:#EAF0FF; --dim:#93A0C2; --faint:#5C6889;
  --blue:#4DA3FF; --cyan:#4DD0FF; --violet:#8E7BFF; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --grad:linear-gradient(110deg,#4DD0FF,#4DA3FF 45%,#8E7BFF);
  --r:16px; --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
  --sidew:256px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  color:var(--text); background:var(--bg);
  font:14.5px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 18% -12%,rgba(77,163,255,.20),transparent 60%),
    radial-gradient(900px 600px at 104% 6%,rgba(142,123,255,.17),transparent 62%),
    radial-gradient(700px 500px at 60% 118%,rgba(77,208,255,.08),transparent 60%),
    linear-gradient(rgba(132,153,204,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(132,153,204,.03) 1px,transparent 1px);
  background-size:auto,auto,auto,48px 48px,48px 48px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(132,153,204,.2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(132,153,204,.36)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--mono)}

/* ------------------------------------------------------------ shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidew) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(13,18,32,.94),rgba(9,12,22,.94));
  border-right:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.logo{width:48px;height:48px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(77,163,255,.55))}
.word{display:block;height:17px;width:auto}
.brand small{display:block;font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:7px}
.ps{margin:0 12px 10px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(132,153,204,.05)}
.ps .r1{display:flex;align-items:center;gap:8px;font-weight:700}
.ps .r1 i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.ps.ok .r1 i{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.ps.bad .r1 i{background:var(--bad);box-shadow:0 0 0 4px rgba(248,113,113,.16)}
.ps .r2{font:500 11px var(--mono);color:var(--dim);margin-top:5px;line-height:1.5;word-break:break-all}
nav{flex:1;overflow:auto;padding:4px 10px}
nav h6{margin:14px 10px 6px;font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
nav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;
  padding:10px 12px;border-radius:11px;font-weight:620;color:var(--dim);text-align:left;transition:background .15s,color .15s}
nav button:hover{background:rgba(132,153,204,.08);color:var(--text)}
nav button.on{color:var(--text);background:linear-gradient(100deg,rgba(77,163,255,.2),rgba(142,123,255,.14))}
nav button.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
nav button.on svg{color:var(--cyan)}
nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button em{font:700 10.5px var(--mono);font-style:normal;padding:2px 7px;border-radius:999px;background:rgba(132,153,204,.14);color:var(--dim)}
nav button em.hot{background:var(--grad);color:#06101F}
.mini{margin:8px 12px 0;padding:10px;border:1px solid var(--line);border-radius:13px;background:rgba(132,153,204,.05);display:flex;gap:10px;align-items:center}
.mini img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:#05080F}
.mini div{min-width:0;flex:1}
.mini small{display:block;font:700 9.5px var(--mono);letter-spacing:.16em;color:var(--ok);text-transform:uppercase}
.mini b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot{padding:12px 18px 16px;font:500 10.5px var(--mono);color:var(--faint);line-height:1.6}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);
  background:rgba(7,10,19,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar h1{margin:0;font-size:21px;font-weight:780;letter-spacing:-.025em}
.bar p{margin:1px 0 0;font-size:12.5px;color:var(--dim)}
.bar .sp{flex:1}
.btn.burger{display:none}
.view{flex:1;overflow:auto;padding:22px 26px 60px;scroll-behavior:smooth}
.view>section{max-width:1380px;margin:0 auto;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ------------------------------------------------------------ atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.pad{padding:18px}
h3.h{margin:0 0 14px;font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:9px}
h3.h::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--grad)}
h3.h em{font-style:normal;color:var(--faint)}
h3.h .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(15,21,37,.7);
  border-radius:11px;padding:9px 15px;font-weight:650;white-space:nowrap;transition:transform .12s,border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--blue);background:rgba(77,163,255,.12)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.pri{border:0;color:#06101F;background:var(--grad);box-shadow:0 10px 26px -12px rgba(77,163,255,.9)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(248,113,113,.5);color:#FCA5A5}
.btn.danger:hover{background:rgba(248,113,113,.14);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.btn.ghost:hover{background:rgba(132,153,204,.1);color:var(--text)}
.btn.ic{padding:8px;border-radius:10px}
.btn[disabled]{opacity:.38;pointer-events:none}
.in{background:rgba(9,13,24,.7);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.16)}
.srch{position:relative;display:flex;align-items:center}
.srch svg{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.srch .in{padding-left:36px;width:240px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:rgba(9,13,24,.6)}
.seg button{border:0;background:transparent;padding:9px 13px;font-weight:620;color:var(--dim)}
.seg button.on{background:rgba(77,163,255,.18);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font:600 11px var(--mono);letter-spacing:.06em;color:var(--dim)}
.chip.ok{border-color:rgba(52,211,153,.45);color:var(--ok)} .chip.warn{border-color:rgba(251,191,36,.45);color:var(--warn)}
.chip.bad{border-color:rgba(248,113,113,.45);color:var(--bad)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools .sp{flex:1}
.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.note{display:flex;gap:10px;align-items:center;padding:11px 15px;border-radius:12px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:#FDE68A;margin-bottom:16px;font-size:13.5px}
.prog{height:6px;border-radius:4px;background:rgba(132,153,204,.14);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:var(--grad);transition:width .25s}
.prog.ok i{background:var(--ok)} .prog.bad i{background:var(--bad)}

/* ------------------------------------------------------------ dashboard */
.hero{position:relative;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;border-color:rgba(77,163,255,.26)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity .6s}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,10,19,.94) 0,rgba(7,10,19,.72) 42%,rgba(7,10,19,.12) 100%),linear-gradient(0deg,rgba(7,10,19,.9),transparent 55%)}
.hero .wm{position:absolute;right:26px;top:50%;width:230px;height:230px;transform:translateY(-50%);opacity:.16;filter:saturate(1.2)}
.hero .c{position:relative;z-index:1;display:flex;align-items:flex-end;gap:20px;padding:24px;width:100%}
.hero .cv{width:132px;height:132px;border-radius:16px;object-fit:cover;flex:none;border:1px solid var(--line2);background:#05080F;box-shadow:0 22px 50px -18px #000}
.hero .cv.ph{display:grid;place-items:center;color:var(--faint)} .hero .cv.ph svg{width:44px;height:44px}
.hero .t{flex:1;min-width:0}
.kick{font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ok);display:flex;align-items:center;gap:8px}
.kick::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.kick.idle{color:var(--faint)} .kick.idle::before{box-shadow:none}
.hero h2{margin:6px 0 6px;font-size:clamp(24px,3.4vw,42px);line-height:1.04;letter-spacing:-.035em;font-weight:820;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero .sub{font:500 12.5px var(--mono);color:var(--dim)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .k{display:flex;align-items:center;gap:8px;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi .k svg{color:var(--cyan)}
.kpi b{display:block;margin-top:10px;font-size:30px;font-weight:790;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kpi b small{font:600 12px var(--mono);color:var(--dim);margin-left:4px;letter-spacing:0}
.kpi .m{margin-top:10px}
.kpi .m i{display:block;height:100%;border-radius:4px;transition:width .6s,background .4s}
.kpi span.s{display:block;margin-top:8px;font-size:12px;color:var(--faint)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.chart svg{width:100%;height:190px;display:block}
.lg{display:flex;gap:16px;align-items:center;font:500 11.5px var(--mono);color:var(--dim)}
.lg b{font-weight:600} .lg b::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.vol{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.vol:first-of-type{border-top:0;padding-top:0}
.ring{width:54px;height:54px;flex:none;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:rgba(132,153,204,.14)} .ring .ar{stroke-linecap:round;transition:stroke-dashoffset .7s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 11.5px var(--mono)}
.vol .t{flex:1;min-width:0}
.vol .t b{display:block;font-weight:680}
.vol .t small{font:500 11.5px var(--mono);color:var(--faint)}
.rowl{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.rowl:first-of-type{border-top:0;padding-top:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:rgba(132,153,204,.3)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.rowl .t{flex:1;min-width:0}
.rowl .t b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowl .t small{font:500 11.5px var(--mono);color:var(--faint)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:13px;border:1px solid var(--line);background:rgba(132,153,204,.05);text-align:left;transition:.15s}
.qa button:hover{border-color:var(--blue);background:rgba(77,163,255,.1);transform:translateY(-2px)}
.qa button svg{color:var(--cyan);width:20px;height:20px}
.qa button b{font-weight:680} .qa button small{color:var(--faint);font-size:12px}

/* ------------------------------------------------------------ library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cover,164px),1fr));gap:20px 16px}
html.noanim *{transition:none!important;animation:none!important}
html.plain body::before{display:none}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.cfg .card{padding:18px 20px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .t{flex:1 1 170px;min-width:0}.opt .t b{display:block;font-weight:650}.opt .t small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.sws{display:flex;gap:8px}.sws button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sws button.on{border-color:var(--text);box-shadow:0 0 0 2px rgba(0,0,0,.5) inset}
.hidel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.game{min-width:0;cursor:pointer}
.cover{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#05080F;border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--mono);color:var(--faint);letter-spacing:.06em}
.cover .go{position:absolute;inset:auto 0 0 0;padding:34px 10px 10px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(5,8,15,.94));opacity:0;transform:translateY(8px);transition:.2s}
.game:hover .cover,.game:focus-within .cover{transform:translateY(-4px);border-color:rgba(77,163,255,.65);box-shadow:0 18px 40px -16px rgba(77,163,255,.6)}
.game:hover .cover img{transform:scale(1.05)}
.game:hover .go,.game:focus-within .go{opacity:1;transform:none}
.game.run .cover{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 14px 36px -12px rgba(52,211,153,.6)}
.tag{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:7px;background:var(--ok);color:#04130D;font:800 10px var(--mono);letter-spacing:.1em}
.game b{display:block;margin-top:10px;font-weight:680;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.game i{font:500 11.5px var(--mono);font-style:normal;color:var(--faint)}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(4,6,12,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer .p{width:min(460px,100vw);height:100%;background:var(--solid);border-left:1px solid var(--line2);overflow:auto;transform:translateX(30px);transition:transform .25s}
.drawer.on .p{transform:none}
.drawer .art{height:230px;background:#05080F center/cover;position:relative}
.drawer .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--solid),transparent 70%)}
.drawer .art button{position:absolute;right:12px;top:12px;z-index:1;background:rgba(7,10,19,.7)}
.drawer .bd{padding:0 22px 26px;margin-top:-64px;position:relative}
.drawer .bd img{width:108px;height:108px;border-radius:14px;border:1px solid var(--line2);object-fit:cover;background:#05080F;box-shadow:0 18px 40px -16px #000}
.drawer h2{margin:14px 0 4px;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:18px 0;font-size:13.5px}
.kv dt{color:var(--faint);font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;word-break:break-all;font-family:var(--mono);font-size:12.5px}

/* ------------------------------------------------------------ files */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0;font:600 13px var(--mono)}
.crumbs button{border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--dim)}
.crumbs button:hover{background:rgba(132,153,204,.1);color:var(--text)}
.crumbs button:last-of-type{color:var(--text)}
.crumbs i{color:var(--faint);font-style:normal}
.places{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.places button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(132,153,204,.05);font-weight:620;color:var(--dim)}
.places button:hover{border-color:var(--blue);color:var(--text)}
.places button small{font:500 11px var(--mono);color:var(--faint)}
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cpc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cpc.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cpc .pv{position:relative;aspect-ratio:16/9;background:rgba(9,13,24,.7)}
.cpc .pv img,.cpc .pv canvas{width:100%;height:100%;object-fit:cover;display:block}
.cpc .pv canvas{cursor:zoom-in;opacity:0;transition:opacity .25s}.cpc .pv canvas.ok{opacity:1}
.cpc .pv .hdr{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:6px;font:700 9.5px var(--mono);letter-spacing:.1em;background:rgba(6,10,20,.78);color:var(--dim)}
#lbox{position:fixed;inset:0;z-index:120;background:rgba(3,5,10,.93);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lbox canvas{max-width:96vw;max-height:94vh;border-radius:10px;box-shadow:0 30px 80px -20px #000}
.cpc .pv .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--faint);font:700 10.5px var(--mono);letter-spacing:.14em;text-decoration:none}
.cpc .pv .ph svg{width:30px;height:30px}
.cpc .pv a.ph:hover{color:var(--blue)}
.cpc .ck{position:absolute;top:8px;left:8px;padding:5px;border-radius:8px;background:rgba(6,10,20,.72);display:flex}
.cpc .bd{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 13px}
.cpc .bd b{font-size:13.5px}.cpc .bd small{grid-row:2;font:500 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpc .bd .btn{grid-row:1/3;grid-column:2;text-decoration:none}
.svbar select.in{min-width:170px}
.game .st{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:999px;font:700 9.5px var(--mono);letter-spacing:.1em;background:rgba(6,10,20,.82);border:1px solid var(--line2)}
.game .st.playing{color:var(--blue);border-color:rgba(77,163,255,.6)}.game .st.done{color:var(--ok);border-color:rgba(52,211,153,.5)}
.game .st.pending{color:var(--warn);border-color:rgba(251,191,36,.5)}.game .st.dropped{color:var(--faint)}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.trc{display:flex;gap:14px;padding:14px 16px;align-items:center}
.trc img,.trc .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:rgba(132,153,204,.12);flex:none}
.trc .t{flex:1;min-width:0}.trc .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trc .t small{display:block;font:500 11.5px var(--mono);color:var(--faint);margin:3px 0 8px}
.trc .g{display:flex;gap:10px;margin-top:8px;font:700 11.5px var(--mono)}
.trc .g span{display:inline-flex;align-items:center;gap:5px}.trc .g i{width:9px;height:9px;border-radius:50%;display:inline-block}
.trc .pc{font:800 20px var(--sans,inherit);min-width:58px;text-align:right}
.trc.full{border-color:rgba(52,211,153,.45)}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stk{padding:16px 18px}.stk label{display:block;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.stk b{font:800 26px var(--sans,inherit);letter-spacing:-.01em}.stk small{display:block;margin-top:4px;color:var(--dim);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:6px 2px 0}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}
.bars span{font:600 10px var(--mono);color:var(--faint);white-space:nowrap}
.rk{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.rk:first-child{border-top:0}
.rk img,.rk .ph{width:40px;height:40px;border-radius:9px;object-fit:cover;background:rgba(132,153,204,.12);flex:none}
.rk .t{flex:1;min-width:0}.rk .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .t .prog{margin-top:6px}.rk em{font:700 12.5px var(--mono);font-style:normal;color:var(--dim);white-space:nowrap}
.svbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 18px;margin-bottom:16px}
.svbar label{display:block;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.svbar .sp,.svh .sp{flex:1}
.svjob{flex-basis:100%}.svjob p{margin:2px 0 8px;color:var(--dim);font-size:13px}
.svu{margin-bottom:14px;overflow:hidden}
.svh{display:flex;align-items:center;gap:13px;padding:14px 18px;cursor:pointer}
.svh:hover{background:rgba(77,163,255,.05)}
.svh b{display:block;font-size:15.5px}.svh small{font:500 11.5px var(--mono);color:var(--faint)}
.svh .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06101F;background:var(--grad)}
.svh .chev{color:var(--faint);width:14px;text-align:center}
.svu table.t{border-top:1px solid var(--line)}
.svi{width:30px;height:30px;border-radius:7px;object-fit:cover;background:rgba(132,153,204,.12);flex:none;display:inline-block}
table.t td small{font:500 11px var(--mono);color:var(--faint);margin-left:6px}
table.t{width:100%;border-collapse:collapse}
table.t th{position:sticky;top:0;text-align:left;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(13,18,32,.96);cursor:pointer;user-select:none;white-space:nowrap}
table.t td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover{background:rgba(77,163,255,.07)}
table.t td.n{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
table.t td.n a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;max-width:100%}
table.t td.n a span{overflow:hidden;text-overflow:ellipsis}
table.t td.n svg{color:var(--faint)} table.t tr.d td.n svg{color:var(--cyan)}
table.t td.r,table.t th.r{text-align:right}
table.t td.m{font:500 12px var(--mono);color:var(--dim)}
table.t td.a{padding:4px 8px;text-align:right}
table.t td.a .btn{opacity:.0;transition:opacity .12s}
table.t tr:hover td.a .btn,table.t td.a .btn:focus{opacity:1}
.tw{overflow:auto;max-height:calc(100vh - 300px);border-radius:var(--r)}
.dropz{position:fixed;inset:14px;z-index:60;border:2px dashed var(--cyan);border-radius:22px;background:rgba(7,10,19,.86);display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}
.dropz.on{opacity:1}
.dropz svg{width:54px;height:54px;color:var(--cyan)}
.dropz b{display:block;font-size:22px;margin-top:10px} .dropz span{color:var(--dim)}
.menu{position:fixed;z-index:50;min-width:210px;padding:6px;border-radius:13px;border:1px solid var(--line2);background:var(--solid);box-shadow:0 24px 60px -18px #000}
.menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 11px;border-radius:9px;text-align:left;color:var(--text)}
.menu button:hover{background:rgba(77,163,255,.14)}
.menu button.danger{color:#FCA5A5}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* ------------------------------------------------------------ lists */
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{display:block;font:500 11.5px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t .prog{margin-top:8px}
.item .acts{display:flex;gap:8px;flex:none;align-items:center}
.badge{display:inline-block;font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:2px;border:1px solid var(--line2);color:var(--dim)}
.badge.ok{border-color:rgba(52,211,153,.5);color:var(--ok)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:36px;height:20px;border-radius:999px;background:rgba(132,153,204,.22);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#C9D3EE;transition:transform .15s}
.sw input:checked+i{background:var(--grad)}
.sw input:checked+i::after{transform:translateX(16px);background:#fff}
.drop{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:var(--r);background:rgba(15,21,37,.5);margin-bottom:14px;transition:.15s}
.drop.over{border-color:var(--blue);background:rgba(77,163,255,.1)}
.drop .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--cyan);background:linear-gradient(140deg,rgba(77,163,255,.18),rgba(142,123,255,.18));border:1px solid var(--line2)}
.drop .tx{flex:1;min-width:0} .drop .tx b{display:block;font-weight:700} .drop .tx span{font-size:13px;color:var(--dim)}
.log{font:500 12px/1.6 var(--mono);max-height:340px;overflow:auto;padding:14px 16px}
.log div{white-space:pre-wrap;word-break:break-word}
.log .warn{color:var(--warn)} .log .error{color:var(--bad)} .log time{color:var(--faint);margin-right:10px}

/* ------------------------------------------------------------ themes */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.theme{overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s,transform .2s}
.theme:hover{transform:translateY(-3px);border-color:var(--line2)}
.theme.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 16px 40px -18px rgba(52,211,153,.6)}
.theme .pv{aspect-ratio:16/9;background:#05080F center/cover;position:relative;display:grid;place-items:center;color:var(--faint)}
.theme .pv svg{width:40px;height:40px}
.theme .pv .tag{left:10px;top:10px}
.theme .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.theme .bd b{font-size:16px;font-weight:720;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme .bd small{font:500 11.5px var(--mono);color:var(--faint)}
.theme .bd .acts{display:flex;gap:8px;margin-top:auto}
.maker{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
.maker canvas,.maker .ph{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line2);background:#05080F;display:block}
.maker .ph{display:grid;place-items:center;color:var(--faint);text-align:center;padding:16px;cursor:pointer;border-style:dashed}
.maker .f{display:flex;flex-direction:column;gap:12px}
.maker label{font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.maker .in{width:100%}
.maker .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.maker p{margin:0;color:var(--dim);font-size:13px}
@media (max-width:760px){.maker{grid-template-columns:1fr}}

/* ------------------------------------------------------------ overlays */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.25s;z-index:80;
  padding:11px 18px;border-radius:13px;background:rgba(15,21,37,.97);border:1px solid var(--line2);font-weight:620;max-width:92vw;box-shadow:0 20px 50px -20px #000}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.err{border-color:var(--bad);color:#FCA5A5}
dialog{border:1px solid var(--line2);border-radius:18px;background:var(--solid);color:var(--text);padding:22px;max-width:min(460px,92vw);width:100%;box-shadow:0 40px 90px -30px #000}
dialog::backdrop{background:rgba(4,6,12,.72);backdrop-filter:blur(4px)}
dialog h4{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
dialog p{margin:0 0 16px;color:var(--dim);word-break:break-word}
dialog .in{width:100%;margin-bottom:16px}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
dialog.wide{max-width:min(980px,96vw)}
dialog textarea{width:100%;height:min(60vh,560px);resize:vertical;font:500 12.5px/1.55 var(--mono);background:#070A12;border:1px solid var(--line2);border-radius:12px;padding:14px;outline:none;margin-bottom:16px;tab-size:2}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:70;transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(4,6,12,.6)}
  .btn.burger{display:inline-flex}
  .bar{padding:12px 14px;position:sticky;top:0;z-index:20}
  .view{padding:16px 14px 70px;overflow:visible}
  .tw{max-height:none}
  table.t td.a .btn{opacity:1}
  .hide-m{display:none}
}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero .c{flex-wrap:wrap}.hero .cv{width:86px;height:86px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:14px 10px}
  .srch .in{width:100%}.srch{flex:1}
  .item{flex-wrap:wrap}.item .acts{width:100%;justify-content:flex-end}
  .cover .go{opacity:1;transform:none}
  .bar p{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function upState(u){

  if(u.st==="ok")return L("Completado","Done")+" · "+size(u.size)+(u.resumed?" · "+L("reanudado","resumed"):"");
  if(u.st==="err")return "Error: "+u.err;

    kpi(L("Últimos 30 días","Last 30 days"),hm(span(30)),active+" "+L("días con juego en total","days played in all"))+
    kpi(L("Racha actual","Current streak"),cur+" "+(cur===1?L("día","day"):L("días","days")),L("mejor racha: ","best streak: ")+best+" "+L("días","days"))+
    kpi(L("Más jugado","Most played"),esc(title(top[0])),hm(g[top[0]].total))+'</div>'+
    '<div class="g2" style="margin-top:0"><div class="card pad"><h3 class="h">'+L("Por semana","By week")+' <em>'+L("últimas 8","last 8")+'</em></h3>'+bars(wk,wmax,function(x){return x.slice(8)+"/"+x.slice(5,7)})+'</div>'+
    '<div class="card pad"><h3 class="h">'+L("Por día","By day")+' <em>'+L("últimos 14","last 14")+'</em></h3>'+bars(dd,dmax,function(x){return x.slice(8)})+'</div></div>'+

function zipData(buf,e){

        if(r<r0)r0=r;if(g<g0)g0=g;if(b<b0)b0=b;if(r>r1)r1=r;if(g>g1)g1=g;if(b>b1)b1=b}}
      var c0=to565(r1,g1,b1),c1=to565(r0,g0,b0),bits=0;
      if(c0===c1){out[o]=c0&255;out[o+1]=c0>>8;out[o+2]=c1&255;out[o+3]=c1>>8;out[o+4]=out[o+5]=out[o+6]=out[o+7]=0;o+=8;continue}
      if(c0<c1){var t=c0;c0=c1;c1=t;t=r0;r0=r1;r1=t;t=g0;g0=g1;g1=t;t=b0;b0=b1;b1=t}
      /* Each pixel goes to the nearest of the four colours on the line from
       * c1 (d = 0) to c0 (d = 1): codes 0 = c0, 1 = c1, 2 = 2/3 c0, 3 = 1/3 c0.
       * One byte of indices per row, two bits per pixel. */
      var dr=r1-r0,dg=g1-g0,db=b1-b0,len=dr*dr+dg*dg+db*db||1;
      for(y=0;y<4;y++){i=((by*4+y)*W+bx*4)*4;var row=0;for(x=0;x<4;x++,i+=4){
        var d=((px[i]-r0)*dr+(px[i+1]-g0)*dg+(px[i+2]-b0)*db)/len;
        row|=(d>0.8333?0:d>0.5?2:d>0.1667?3:1)<<(x*2)}
        out[o+4+y]=row}
      out[o]=c0&255;out[o+1]=c0>>8;out[o+2]=c1&255;out[o+3]=c1>>8;o+=8}
    step(by/BH);if(by<BH)setTimeout(slice,0);else done(out)})()})}
/* A zstd frame of raw (uncompressed) blocks: valid for any zstd reader. */
function zstdRaw(d){var n=Math.ceil(d.length/131072),out=new Uint8Array(9+n*3+d.length),o=0,p=0;
  out.set([0x28,0xB5,0x2F,0xFD,0xA0,d.length&255,d.length>>8&255,d.length>>16&255,d.length>>>24]);o=9;
  for(var i=0;i<n;i++){var len=Math.min(131072,d.length-p),h=(len<<3)|(i===n-1?1:0);
    out[o]=h&255;out[o+1]=h>>8&255;out[o+2]=h>>16&255;o+=3;out.set(d.subarray(p,p+len),o);o+=len;p+=len}
  return out}
function putBlob(path,blob,onp){return new Promise(function(res,rej){var x=new XMLHttpRequest();
  x.open("PUT","/fs/put?path="+enc(path));if(onp)x.upload.onprogress=function(e){if(e.lengthComputable)onp(e.loaded/e.total)};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(_){}
    if(x.status===200&&j.ok!==false)res();else rej(new Error(j.error||("HTTP "+x.status)))};
  x.onerror=function(){rej(new Error(L("Sin conexión","Connection lost")))};x.send(blob)})}
function jobDone(id){return new Promise(function(res,rej){watchJob(id,function(j){j.state==="done"?res():rej(new Error(j.error||j.state))})})}
function makeTheme(){
  var mk=S.tmk,name=(mk.name||"").replace(/[^A-Za-z0-9 ._()-]/g," ").replace(/\s+/g," ").trim().replace(/^\.+/,"");
  if(!name){toast(L("Ponle un nombre al tema","Give the theme a name"),true);return}
  if(S.themes.some(function(t){return t.name===name})){toast(L("Ya hay un tema con ese nombre","There is already a theme with that name"),true);return}
  var dir=TDIR+"/"+name;
  function st(msg,p){mk.busy=msg;mk.pct=Math.round(p*100);paintThemes()}
  var chain=api("/api/fs/mkdir",{path:dir});
  if(mk.img){
    chain=chain.then(function(){st(L("Convirtiendo la imagen a 4K…","Converting the image to 4K…"),0);return wait(30)})
    .then(function(){var px=mk.img.getContext("2d").getImageData(0,0,3840,2160).data,last=0;
      return dxt1(px,3840,2160,function(p){if(p-last>.04){last=p;st(L("Convirtiendo la imagen a 4K…","Converting the image to 4K…"),p*.4)}})})
    .then(function(body){var head=Uint8Array.from(atob(DDS_HEAD),function(c){return c.charCodeAt(0)}),dds=new Uint8Array(128+body.length);
      dds.set(head);dds.set(body,128);var z=zstdRaw(dds);
      return putBlob(dir+"/"+BGS[0]+".dds.zst",new Blob([z]),function(p){st(L("Enviando el fondo a la consola…","Sending the background to the console…"),.4+p*.25)})})
    .then(function(){var i=1;return (function next(){
      if(i>=BGS.length)return;
      st(L("Preparando los fondos en la consola…","Preparing the backgrounds on the console…")+" "+i+"/"+(BGS.length-1),.65+i/BGS.length*.25);
      return api("/api/fs/copy",{from:dir+"/"+BGS[0]+".dds.zst",to:dir+"/"+BGS[i++]+".dds.zst"}).then(function(j){return jobDone(j.job)}).then(next)})()})
    .then(function(){return new Promise(function(res){var c=document.createElement("canvas");c.width=640;c.height=360;
      c.getContext("2d").drawImage(mk.img,0,0,640,360);c.toBlob(res,"image/jpeg",.82)})})
    .then(function(b){return putBlob(dir+"/preview.jpg",b)});
  }
  if(mk.at9)chain=chain.then(function(){return putBlob(dir+"/bgm_home.at9",mk.at9,function(p){st(L("Enviando la música…","Sending the music…"),.9+p*.08)})});
  chain.then(function(){return api("/api/fs/text",{path:dir+"/theme.json",content:JSON.stringify({name:name,created:new Date().toISOString(),by:"NeoWEB"})+"\n"})})
  .then(function(){S.tmk={name:"",img:null,at9:null,busy:"",pct:0};toast(L("Tema creado: ","Theme made: ")+name);return loadThemes()})
  .catch(function(e){mk.busy="";fail(e);api("/api/fs/delete",{path:dir}).catch(function(){}).then(loadThemes)});
}

function loadProcs(){return api("/api/sys/procs").then(function(j){S.procs=j.procs||[];if(S.view==="procs")paintProcs()}).catch(function(){})}
function paintProcs(){
  var q=S.pq.toLowerCase(),k=S.psort;
  var list=S.procs.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>=0||String(p.pid).indexOf(q)>=0})
    .sort(function(a,b){return k==="name"?a.name.localeCompare(b.name):k==="pid"?a.pid-b.pid:b.rss-a.rss});
  var tot=S.procs.reduce(function(a,p){return a+p.rss},0),max=list.reduce(function(a,p){return Math.max(a,p.rss)},1);
  var keep=document.activeElement&&document.activeElement.id==="p-q";
  $("v-procs").innerHTML='<div class="tools"><div class="srch">'+ic("search")+'<input class="in" id="p-q" type="search" placeholder="'+L("Buscar proceso o pid…","Search process or pid…")+'" value="'+esc(S.pq)+'"></div>'+
    '<span class="sp"></span><span class="chip">'+S.procs.length+" "+L("procesos","processes")+'</span><span class="chip">'+size(tot)+" RAM</span></div>"+
    '<div class="card tw"><table class="t"><thead><tr><th data-k="name">'+L("Proceso","Process")+(k==="name"?" ↑":"")+'</th><th data-k="pid" class="r">PID'+(k==="pid"?" ↑":"")+'</th><th class="r hide-m">PPID</th><th class="hide-m">'+L("Estado","State")+
    '</th><th data-k="rss" class="r">'+L("Memoria","Memory")+(k==="rss"?" ↓":"")+'</th><th></th></tr></thead><tbody>'+
    list.map(function(p){return '<tr><td class="n"><a style="cursor:default">'+ic("procs")+'<span>'+esc(p.name)+'</span></a></td><td class="m r">'+p.pid+'</td><td class="m r hide-m">'+p.ppid+'</td><td class="m hide-m">'+esc(p.state)+
      '</td><td class="m r"><div style="display:flex;align-items:center;gap:10px;justify-content:flex-end"><div class="prog hide-m" style="width:90px"><i style="width:'+Math.round(p.rss/max*100)+'%"></i></div>'+size(p.rss)+'</div></td>'+
      '<td class="a"><button class="btn sm danger" data-kill="'+p.pid+'" data-n="'+esc(p.name)+'">'+L("Terminar","Kill")+'</button></td></tr>'}).join("")+'</tbody></table></div>';
  $("p-q").oninput=function(){S.pq=this.value;paintProcs()};
  if(keep){var e=$("p-q");e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
$("v-procs").addEventListener("click",function(e){var b=e.target.closest("[data-kill]"),h=e.target.closest("th[data-k]");
  if(h){S.psort=h.getAttribute("data-k");paintProcs();return}
  if(b){var pid=+b.getAttribute("data-kill"),n=b.getAttribute("data-n");
    ask(L("Terminar ","Kill ")+n+" ("+pid+")",L("Terminar un proceso del sistema puede dejar la consola inestable o reiniciarla.","Killing a system process can leave the console unstable or restart it."),L("Terminar","Kill"),true).then(function(ok){
      if(ok)api("/api/sys/kill",{pid:pid}).then(function(){toast(n+L(" terminado"," killed"));setTimeout(loadProcs,600)}).catch(fail)})}});

    ask(t[0],t[1],t[2],a!=="rest").then(function(ok){if(ok)api("/api/sys/power",{action:a}).then(function(){toast(L("Orden enviada a la consola","Order sent to the console"))}).catch(fail)})}});
}

    '<div style="display:flex;gap:10px"><input class="in" id="nt" style="flex:1" maxlength="200" placeholder="'+L("Texto del aviso…","Notification text…")+'"><button class="btn pri" id="nb">'+ic("bell")+L("Enviar","Send")+'</button></div></div></div>'+
    (S.full?'<div class="g2"><div class="card pad"><h3 class="h">'+L("Ventilador","Fan")+' <em>'+(i.fanDuty!=null?L("girando al ","spinning at ")+i.fanDuty+"%":"")+'</em></h3>'+fanHtml()+'</div>'+
