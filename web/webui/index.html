    (ln.installed?'<button class="btn danger" id="ln-r"'+(S.ro?" disabled":"")+'>'+L("Quitar","Remove")+'</button>':"")+'</div></div>';
  $("ln-i").onclick=function(){var u=$("ln-u").value.trim();api("/api/launcher/install",{uri:u}).then(function(){toast(L("Icono instalado: búscalo en Contenido multimedia","Icon installed: look for it under Media"));loadLnch()}).catch(fail)};
  if($("ln-r"))$("ln-r").onclick=function(){ask(L("Quitar el icono de NeoWEB","Remove the NeoWEB icon"),L("Desaparece de la pantalla de inicio. NeoWEB sigue funcionando desde el PC o el móvil.","It goes from the home screen. NeoWEB keeps working from the PC or the phone."),L("Quitar","Remove"),true).then(function(ok){if(ok)api("/api/launcher/remove",{}).then(function(){toast(L("Icono quitado","Icon removed"));loadLnch()}).catch(fail)})};
}
$("v-system").addEventListener("click",function(e){var a=e.target.closest("[data-open]");if(a){S.cwd=a.getAttribute("data-open");show("files",true)}});

/* ------------------------------------------------------------ new version
 * Only a notice: GitHub lists the releases (pre-releases too), the page
 * compares them with the NeoHEN that is loaded and links the newest one. */
function verKey(v){var m=/^v?(\d+)\.(\d+)\.(\d+)(?:-rc(\d+))?/.exec(v||"");if(!m)return null;
  return [+m[1],+m[2],+m[3],m[4]==null?1e6:+m[4]]} /* a final release ranks above its rcs */
function verCmp(a,b){for(var i=0;i<4;i++)if(a[i]!==b[i])return a[i]<b[i]?-1:1;return 0}
function checkUpd(cur){
  S.upd={cur:cur};var mine=verKey(cur);if(!mine)return;
  var c=null;try{c=JSON.parse(sessionStorage.getItem("nw-upd")||"null")}catch(_){}
  (c&&Date.now()-c.t<6*36e5?Promise.resolve(c.rel):fetch("https://api.github.com/repos/neox69/NeoHEN/releases?per_page=10").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    var rel=j.filter(function(x){return !x.draft&&verKey(x.tag_name)}).map(function(x){return {tag:x.tag_name,url:x.html_url,date:(x.published_at||"").slice(0,10)}});
    try{sessionStorage.setItem("nw-upd",JSON.stringify({t:Date.now(),rel:rel}))}catch(_){}return rel}))
  .then(function(rel){var best=null;rel.forEach(function(x){if(!best||verCmp(verKey(x.tag),verKey(best.tag))>0)best=x});
    if(best&&verCmp(verKey(best.tag),mine)>0){S.upd.new=best;
      if(!S.ev.some(function(e){return e.t.indexOf(best.tag)>=0}))note("ok",L("Hay NeoHEN ","NeoHEN ")+best.tag.replace(/^v/,"")+L(""," is out"),L("Tienes ","You have ")+cur);
      if(S.view==="panel")paintPanel()}})
  .catch(function(){});
}
function updNote(){var u=S.upd;if(!u||!u.new)return "";
  return '<div class="note" style="border-color:rgba(77,163,255,.4);background:rgba(77,163,255,.08);color:#CFE4FF;margin-bottom:16px"><span style="flex:1">'+L("Hay una versión nueva de NeoHEN: ","A new NeoHEN version is out: ")+'<b>'+esc(u.new.tag.replace(/^v/,""))+'</b>'+(u.new.date?" ("+esc(u.new.date)+")":"")+L(". Tienes cargada la ",". You have ")+esc(u.cur)+L("."," loaded.")+'</span><a class="btn sm" href="'+esc(u.new.url)+'" target="_blank" rel="noopener">'+L("Ver en GitHub","See it on GitHub")+'</a></div>'}

/* ------------------------------------------------------------ data */
function online(v){
  if(S.online===v&&v)return;S.online=v;
  $("ps").className="ps "+(v?"ok":"bad");$("ps-t").textContent=v?L("Conectada","Connected"):L("Sin conexión","Offline");
}
function fast(){
  return api("/api/sys/info").then(function(i){
    S.info=i;online(true);hudPaint(i);
    $("ps-m").innerHTML=[i.model,i.firmware&&"FW "+i.firmware,i.ips&&i.ips[0]&&i.ips[0].ip].filter(Boolean).map(esc).join("<br>")+
      (S.upd&&S.upd.new?'<br><a href="'+esc(S.upd.new.url)+'" target="_blank" rel="noopener" style="color:var(--warn)">'+L("Hay NeoHEN ","NeoHEN ")+esc(S.upd.new.tag.replace(/^v/,""))+L(""," is out")+'</a>':"");
    $("ver").textContent="NeoWEB · v"+(i.version||"")+(i.neohen?" · NeoHEN "+String(i.neohen).replace(/\+.*$/,""):"");
    if(i.neohen&&!$("ver").onclick){$("ver").style.cursor="pointer";$("ver").title=L("Novedades de esta versión","What is new in this version");$("ver").onclick=function(){newsShow(S.info.neohen)}}
    if(i.neohen&&!S.upd)checkUpd(i.neohen);
    if(i.neohen)newsCheck(i.neohen);
    if(i.cpuTemp>0||i.socTemp>0){S.hist.push([i.cpuTemp|0,i.socTemp|0]);if(S.hist.length>120)S.hist.shift()}
    var r=i.running&&i.running.titleId||null,ch=r!==S.running;
    /* the first answer only says how things are; changes after it are news */
    if(ch&&S.runKnown){if(S.running)note("",L("Cerrado: ","Closed: ")+title(S.running),S.running);if(r)note("",L("Abierto: ","Opened: ")+title(r),r)}
    S.runKnown=true;S.running=r;
    var hot=Math.max(i.cpuTemp|0,i.socTemp|0);if(hot>=85&&Date.now()-(S.hotAt||0)>6e5){S.hotAt=Date.now();note("warn",L("Consola caliente: ","Console running hot: ")+hot+" °C",L("Mira el ventilador en Sistema","Check the fan in System"))}
    $("mini").hidden=!r;if(r){$("mini-i").src="/apps/icon?id="+r;$("mini-k").textContent=L("Jugando","Playing");$("mini-t").textContent=title(r)}
    if(S.view==="panel")paintPanel();else if(ch&&S.view==="library")paintGrid();
  }).catch(function(){online(false)});
}
function slow(){
  return Promise.all([api("/api/apps/list"),api("/api/sys/mounts")]).then(function(x){
    S.apps=x[0].apps||[];S.mounts=x[1].mounts||[];paintNav();loadStatus();if(S.full)api("/api/stats/playtime").then(function(j){S.play={games:j.games||{},today:j.today||""}}).catch(function(){});
    if(S.view==="panel")paintPanel();else if(S.view==="library")paintGrid();else if(S.view==="system"&&!/^(fan-r|nt|ln-u)$/.test((document.activeElement||{}).id||""))paintSys();
    else if(S.view==="fixes"&&S.fx.loaded&&(document.activeElement||{}).tagName!=="SELECT")paintFixes();
  }).catch(function(){});
}
function probe(){return fetch("/api/fs/stat?path=/data").then(function(r){S.full=r.status!==404},function(){S.full=false})}
$("sfoot").innerHTML=L("Servicio remoto de NeoHEN","NeoHEN remote service")+'<br><a href="https://github.com/neox69/NeoHEN" target="_blank" rel="noopener">github.com/neox69/NeoHEN</a>';
function clock(){$("clock").textContent=new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:CFG.clock12})}
clock();setInterval(clock,20000);

paintNav();paintPanel();$("vt").textContent=VIEWS[0][1];$("vs").textContent=VIEWS[0][2];
probe().then(function(){show(location.hash.slice(1)||CFG.start||"panel");return fast()}).then(cfgPull).then(slow).then(function(){loadPay();loadJobs()});
(function tickFast(){setTimeout(function(){
  if(!document.hidden){fast();
    if(S.view==="payloads")loadPay();if(S.view==="procs")loadProcs();
    if(S.view==="transfers"||S.jobs.some(function(j){return j.state==="running"}))loadJobs()}
  tickFast()},Math.max(S.lite?10:2,CFG.refresh)*1000)})();
setInterval(function(){if(!document.hidden){slow();loadPay()}},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){fast();slow();loadPay()}});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){$("drawer").className="drawer";$("menu").hidden=true;$("side").className="side"}
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){var q=$(S.view==="library"?"lib-q":S.view==="files"?"f-q":S.view==="procs"?"p-q":"");if(q){e.preventDefault();q.focus()}}
});
})();
</script>
