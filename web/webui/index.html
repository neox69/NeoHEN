<style>
:root{
  --bg:#070A13; --bg2:#0B0F1A; --side:#0A0E19; --panel:rgba(20,27,45,.66); --solid:#111829;
  --line:rgba(132,153,204,.14); --line2:rgba(132,153,204,.26);
  --text:#EAF0FF; --dim:#93A0C2; --faint:#5C6889;
  --blue:#4DA3FF; --cyan:#4DD0FF; --violet:#8E7BFF; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --grad:linear-gradient(110deg,#4DD0FF,#4DA3FF 45%,#8E7BFF);
  --r:16px; --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
  --sidew:256px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  color:var(--text); background:var(--bg);
  font:14.5px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 18% -12%,rgba(77,163,255,.20),transparent 60%),
    radial-gradient(900px 600px at 104% 6%,rgba(142,123,255,.17),transparent 62%),
    radial-gradient(700px 500px at 60% 118%,rgba(77,208,255,.08),transparent 60%),
    linear-gradient(rgba(132,153,204,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(132,153,204,.03) 1px,transparent 1px);
  background-size:auto,auto,auto,48px 48px,48px 48px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(132,153,204,.2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(132,153,204,.36)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--mono)}

/* ------------------------------------------------------------ shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidew) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(13,18,32,.94),rgba(9,12,22,.94));
  border-right:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.logo{width:48px;height:48px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(77,163,255,.55))}
.word{display:block;height:17px;width:auto}
.brand small{display:block;font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:7px}
.ps{margin:0 12px 10px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(132,153,204,.05)}
.ps .r1{display:flex;align-items:center;gap:8px;font-weight:700}
.ps .r1 i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.ps.ok .r1 i{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.ps.bad .r1 i{background:var(--bad);box-shadow:0 0 0 4px rgba(248,113,113,.16)}
.ps .r2{font:500 11px var(--mono);color:var(--dim);margin-top:5px;line-height:1.5;word-break:break-all}
nav{flex:1;overflow:auto;padding:4px 10px}
nav h6{margin:14px 10px 6px;font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
nav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;
  padding:10px 12px;border-radius:11px;font-weight:620;color:var(--dim);text-align:left;transition:background .15s,color .15s}
nav button:hover{background:rgba(132,153,204,.08);color:var(--text)}
nav button.on{color:var(--text);background:linear-gradient(100deg,rgba(77,163,255,.2),rgba(142,123,255,.14))}
nav button.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
nav button.on svg{color:var(--cyan)}
nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button em{font:700 10.5px var(--mono);font-style:normal;padding:2px 7px;border-radius:999px;background:rgba(132,153,204,.14);color:var(--dim)}
nav button em.hot{background:var(--grad);color:#06101F}
.mini{margin:8px 12px 0;padding:10px;border:1px solid var(--line);border-radius:13px;background:rgba(132,153,204,.05);display:flex;gap:10px;align-items:center}
.mini img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:#05080F}
.mini div{min-width:0;flex:1}
.mini small{display:block;font:700 9.5px var(--mono);letter-spacing:.16em;color:var(--ok);text-transform:uppercase}
.mini b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot{padding:12px 18px 16px;font:500 10.5px var(--mono);color:var(--faint);line-height:1.6}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);
  background:rgba(7,10,19,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar h1{margin:0;font-size:21px;font-weight:780;letter-spacing:-.025em}
.bar p{margin:1px 0 0;font-size:12.5px;color:var(--dim)}
.bar .sp{flex:1}
.btn.burger{display:none}
.view{flex:1;overflow:auto;padding:22px 26px 60px;scroll-behavior:smooth}
.view>section{max-width:1380px;margin:0 auto;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ------------------------------------------------------------ atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.pad{padding:18px}
h3.h{margin:0 0 14px;font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:9px}
h3.h::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--grad)}
h3.h em{font-style:normal;color:var(--faint)}
h3.h .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(15,21,37,.7);
  border-radius:11px;padding:9px 15px;font-weight:650;white-space:nowrap;transition:transform .12s,border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--blue);background:rgba(77,163,255,.12)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.pri{border:0;color:#06101F;background:var(--grad);box-shadow:0 10px 26px -12px rgba(77,163,255,.9)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(248,113,113,.5);color:#FCA5A5}
.btn.danger:hover{background:rgba(248,113,113,.14);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.btn.ghost:hover{background:rgba(132,153,204,.1);color:var(--text)}
.btn.ic{padding:8px;border-radius:10px}
.btn[disabled]{opacity:.38;pointer-events:none}
.in{background:rgba(9,13,24,.7);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.16)}
.srch{position:relative;display:flex;align-items:center}
.srch svg{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.srch .in{padding-left:36px;width:240px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:rgba(9,13,24,.6)}
.seg button{border:0;background:transparent;padding:9px 13px;font-weight:620;color:var(--dim)}
.seg button.on{background:rgba(77,163,255,.18);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font:600 11px var(--mono);letter-spacing:.06em;color:var(--dim)}
.chip.ok{border-color:rgba(52,211,153,.45);color:var(--ok)} .chip.warn{border-color:rgba(251,191,36,.45);color:var(--warn)}
.chip.bad{border-color:rgba(248,113,113,.45);color:var(--bad)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools .sp{flex:1}
.empty{padding:44px 20px;text-align:center;color:var(--dim)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.note{display:flex;gap:10px;align-items:center;padding:11px 15px;border-radius:12px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:#FDE68A;margin-bottom:16px;font-size:13.5px}
.prog{height:6px;border-radius:4px;background:rgba(132,153,204,.14);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:4px;background:var(--grad);transition:width .25s}
.prog.ok i{background:var(--ok)} .prog.bad i{background:var(--bad)}

/* ------------------------------------------------------------ dashboard */
.hero{position:relative;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;border-color:rgba(77,163,255,.26)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity .6s}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,10,19,.94) 0,rgba(7,10,19,.72) 42%,rgba(7,10,19,.12) 100%),linear-gradient(0deg,rgba(7,10,19,.9),transparent 55%)}

.hero .t{flex:1;min-width:0}
.kick{font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ok);display:flex;align-items:center;gap:8px}
.kick::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.kick.idle{color:var(--faint)} .kick.idle::before{box-shadow:none}
.hero h2{margin:6px 0 6px;font-size:clamp(24px,3.4vw,42px);line-height:1.04;letter-spacing:-.035em;font-weight:820;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero .sub{font:500 12.5px var(--mono);color:var(--dim)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
.kpi{padding:16px;position:relative;overflow:hidden}

.kpi .k svg{color:var(--cyan)}
.kpi b{display:block;margin-top:10px;font-size:30px;font-weight:790;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kpi b small{font:600 12px var(--mono);color:var(--dim);margin-left:4px;letter-spacing:0}
.kpi .m{margin-top:10px}
.kpi .m i{display:block;height:100%;border-radius:4px;transition:width .6s,background .4s}
.kpi span.s{display:block;margin-top:8px;font-size:12px;color:var(--faint)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}

.chart svg{width:100%;height:190px;display:block}
.lg{display:flex;gap:16px;align-items:center;font:500 11.5px var(--mono);color:var(--dim)}

.vol:first-of-type{border-top:0;padding-top:0}
.ring{width:54px;height:54px;flex:none;position:relative}

.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:rgba(132,153,204,.14)} .ring .ar{stroke-linecap:round;transition:stroke-dashoffset .7s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 11.5px var(--mono)}
.vol .t{flex:1;min-width:0}
.vol .t b{display:block;font-weight:680}
.vol .t small{font:500 11.5px var(--mono);color:var(--faint)}
.rowl{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.rowl:first-of-type{border-top:0;padding-top:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:rgba(132,153,204,.3)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.rowl .t{flex:1;min-width:0}
.rowl .t b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowl .t small{font:500 11.5px var(--mono);color:var(--faint)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:13px;border:1px solid var(--line);background:rgba(132,153,204,.05);text-align:left;transition:.15s}

.qa button b{font-weight:680} .qa button small{color:var(--faint);font-size:12px}

/* ------------------------------------------------------------ library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cover,164px),1fr));gap:20px 16px}
html.noanim *{transition:none!important;animation:none!important}
html.plain body::before{display:none}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.cfg .card{padding:18px 20px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .t{flex:1 1 170px;min-width:0}.opt .t b{display:block;font-weight:650}.opt .t small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.sws{display:flex;gap:8px}.sws button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sws button.on{border-color:var(--text);box-shadow:0 0 0 2px rgba(0,0,0,.5) inset}
.hidel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.game{min-width:0;cursor:pointer}
.cover{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#05080F;border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--mono);color:var(--faint);letter-spacing:.06em}
.cover .go{position:absolute;inset:auto 0 0 0;padding:34px 10px 10px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(5,8,15,.94));opacity:0;transform:translateY(8px);transition:.2s}
.game:hover .cover,.game:focus-within .cover{transform:translateY(-4px);border-color:rgba(77,163,255,.65);box-shadow:0 18px 40px -16px rgba(77,163,255,.6)}
.game:hover .cover img{transform:scale(1.05)}
.game:hover .go,.game:focus-within .go{opacity:1;transform:none}
.game.run .cover{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 14px 36px -12px rgba(52,211,153,.6)}
.tag{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:7px;background:var(--ok);color:#04130D;font:800 10px var(--mono);letter-spacing:.1em}
.game b{display:block;margin-top:10px;font-weight:680;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.game i{font:500 11.5px var(--mono);font-style:normal;color:var(--faint)}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(4,6,12,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer .p{width:min(460px,100vw);height:100%;background:var(--solid);border-left:1px solid var(--line2);overflow:auto;transform:translateX(30px);transition:transform .25s}
.drawer.on .p{transform:none}
.drawer .art{height:230px;background:#05080F center/cover;position:relative}
.drawer .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--solid),transparent 70%)}
.drawer .art button{position:absolute;right:12px;top:12px;z-index:1;background:rgba(7,10,19,.7)}
.drawer .bd{padding:0 22px 26px;margin-top:-64px;position:relative}
.drawer .bd img{width:108px;height:108px;border-radius:14px;border:1px solid var(--line2);object-fit:cover;background:#05080F;box-shadow:0 18px 40px -16px #000}
.drawer h2{margin:14px 0 4px;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:18px 0;font-size:13.5px}
.kv dt{color:var(--faint);font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;word-break:break-all;font-family:var(--mono);font-size:12.5px}

/* ------------------------------------------------------------ files */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0;font:600 13px var(--mono)}
.crumbs button{border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--dim)}
.crumbs button:hover{background:rgba(132,153,204,.1);color:var(--text)}
.crumbs button:last-of-type{color:var(--text)}
.crumbs i{color:var(--faint);font-style:normal}
.places{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.places button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(132,153,204,.05);font-weight:620;color:var(--dim)}
.places button:hover{border-color:var(--blue);color:var(--text)}
.places button small{font:500 11px var(--mono);color:var(--faint)}
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cpc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cpc.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cpc .pv{position:relative;aspect-ratio:16/9;background:rgba(9,13,24,.7)}
.cpc .pv img,.cpc .pv canvas{width:100%;height:100%;object-fit:cover;display:block}
.cpc .pv canvas{cursor:zoom-in;opacity:0;transition:opacity .25s}.cpc .pv canvas.ok{opacity:1}
.cpc .pv .hdr{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:6px;font:700 9.5px var(--mono);letter-spacing:.1em;background:rgba(6,10,20,.78);color:var(--dim)}
#lbox{position:fixed;inset:0;z-index:120;background:rgba(3,5,10,.93);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lbox canvas{max-width:96vw;max-height:94vh;border-radius:10px;box-shadow:0 30px 80px -20px #000}
.cpc .pv .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--faint);font:700 10.5px var(--mono);letter-spacing:.14em;text-decoration:none}
.cpc .pv .ph svg{width:30px;height:30px}
.cpc .pv a.ph:hover{color:var(--blue)}
.cpc .ck{position:absolute;top:8px;left:8px;padding:5px;border-radius:8px;background:rgba(6,10,20,.72);display:flex}
.cpc .bd{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 13px}
.cpc .bd b{font-size:13.5px}.cpc .bd small{grid-row:2;font:500 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpc .bd .btn{grid-row:1/3;grid-column:2;text-decoration:none}
.svbar select.in{min-width:170px}
.game .st{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:999px;font:700 9.5px var(--mono);letter-spacing:.1em;background:rgba(6,10,20,.82);border:1px solid var(--line2)}
.game .st.playing{color:var(--blue);border-color:rgba(77,163,255,.6)}.game .st.done{color:var(--ok);border-color:rgba(52,211,153,.5)}
.game .st.pending{color:var(--warn);border-color:rgba(251,191,36,.5)}.game .st.dropped{color:var(--faint)}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.trc{display:flex;gap:14px;padding:14px 16px;align-items:center}
.trc img,.trc .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:rgba(132,153,204,.12);flex:none}
.trc .t{flex:1;min-width:0}.trc .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trc .t small{display:block;font:500 11.5px var(--mono);color:var(--faint);margin:3px 0 8px}
.trc .g{display:flex;gap:10px;margin-top:8px;font:700 11.5px var(--mono)}
.trc .g span{display:inline-flex;align-items:center;gap:5px}.trc .g i{width:9px;height:9px;border-radius:50%;display:inline-block}
.trc .pc{font:800 20px var(--sans,inherit);min-width:58px;text-align:right}
.trc.full{border-color:rgba(52,211,153,.45)}
.trc[data-set]{cursor:pointer}.trc[data-set]:hover{border-color:var(--line2)}
.trw img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:rgba(132,153,204,.12);flex:none}
.trw.no img{filter:grayscale(1);opacity:.45}.trw .t small{white-space:normal}
.gmb{border-top:1px solid var(--line);margin:0 0 16px;padding-top:14px;font-size:13.5px}
.gmb p{margin:0 0 10px;color:var(--dim)}.gmb .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chl .item:first-child{border-top:0}
.svbar label.sw{display:inline-flex;font:inherit;font-size:13px;letter-spacing:0;text-transform:none;margin:0;color:var(--dim)}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stk{padding:16px 18px}.stk label{display:block;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.stk b{font:800 26px var(--sans,inherit);letter-spacing:-.01em}.stk small{display:block;margin-top:4px;color:var(--dim);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:6px 2px 0}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}
.bars span{font:600 10px var(--mono);color:var(--faint);white-space:nowrap}
.rk{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.rk:first-child{border-top:0}
.rk img,.rk .ph{width:40px;height:40px;border-radius:9px;object-fit:cover;background:rgba(132,153,204,.12);flex:none}
.rk .t{flex:1;min-width:0}.rk .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .t .prog{margin-top:6px}.rk em{font:700 12.5px var(--mono);font-style:normal;color:var(--dim);white-space:nowrap}
.svbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px 18px;margin-bottom:16px}
.svbar label{display:block;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.svbar .sp,.svh .sp{flex:1}
.svjob{flex-basis:100%}.svjob p{margin:2px 0 8px;color:var(--dim);font-size:13px}
.svu{margin-bottom:14px;overflow:hidden}
.svh{display:flex;align-items:center;gap:13px;padding:14px 18px;cursor:pointer}
.svh:hover{background:rgba(77,163,255,.05)}
.svh b{display:block;font-size:15.5px}.svh small{font:500 11.5px var(--mono);color:var(--faint)}
.svh .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06101F;background:var(--grad)}
.svh .chev{color:var(--faint);width:14px;text-align:center}
.svu table.t{border-top:1px solid var(--line)}
.svi{width:30px;height:30px;border-radius:7px;object-fit:cover;background:rgba(132,153,204,.12);flex:none;display:inline-block}
table.t td small{font:500 11px var(--mono);color:var(--faint);margin-left:6px}
table.t{width:100%;border-collapse:collapse}
table.t th{position:sticky;top:0;text-align:left;font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(13,18,32,.96);cursor:pointer;user-select:none;white-space:nowrap}
table.t td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover{background:rgba(77,163,255,.07)}
table.t td.n{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
table.t td.n a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;max-width:100%}
table.t td.n a span{overflow:hidden;text-overflow:ellipsis}
table.t td.n svg{color:var(--faint)} table.t tr.d td.n svg{color:var(--cyan)}
table.t td.r,table.t th.r{text-align:right}
table.t td.m{font:500 12px var(--mono);color:var(--dim)}
table.t td.a{padding:4px 8px;text-align:right}
table.t td.a .btn{opacity:.0;transition:opacity .12s}
table.t tr:hover td.a .btn,table.t td.a .btn:focus{opacity:1}
.tw{overflow:auto;max-height:calc(100vh - 300px);border-radius:var(--r)}
.dropz{position:fixed;inset:14px;z-index:60;border:2px dashed var(--cyan);border-radius:22px;background:rgba(7,10,19,.86);display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}
.dropz.on{opacity:1}
.dropz svg{width:54px;height:54px;color:var(--cyan)}
.dropz b{display:block;font-size:22px;margin-top:10px} .dropz span{color:var(--dim)}
.menu{position:fixed;z-index:50;min-width:210px;padding:6px;border-radius:13px;border:1px solid var(--line2);background:var(--solid);box-shadow:0 24px 60px -18px #000}
.menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 11px;border-radius:9px;text-align:left;color:var(--text)}
.menu button:hover{background:rgba(77,163,255,.14)}
.menu button.danger{color:#FCA5A5}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* ------------------------------------------------------------ lists */
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{display:block;font:500 11.5px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t .prog{margin-top:8px}
.item .acts{display:flex;gap:8px;flex:none;align-items:center}
.badge{display:inline-block;font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:2px;border:1px solid var(--line2);color:var(--dim)}
.badge.ok{border-color:rgba(52,211,153,.5);color:var(--ok)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:36px;height:20px;border-radius:999px;background:rgba(132,153,204,.22);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#C9D3EE;transition:transform .15s}
.sw input:checked+i{background:var(--grad)}
.sw input:checked+i::after{transform:translateX(16px);background:#fff}
.drop{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:var(--r);background:rgba(15,21,37,.5);margin-bottom:14px;transition:.15s}
.drop.over{border-color:var(--blue);background:rgba(77,163,255,.1)}
.drop .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--cyan);background:linear-gradient(140deg,rgba(77,163,255,.18),rgba(142,123,255,.18));border:1px solid var(--line2)}
.drop .tx{flex:1;min-width:0} .drop .tx b{display:block;font-weight:700} .drop .tx span{font-size:13px;color:var(--dim)}
.log{font:500 12px/1.6 var(--mono);max-height:340px;overflow:auto;padding:14px 16px}
.log div{white-space:pre-wrap;word-break:break-word}
.log .warn{color:var(--warn)} .log .error{color:var(--bad)} .log time{color:var(--faint);margin-right:10px}

/* ------------------------------------------------------------ themes */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.theme{overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s,transform .2s}
.theme:hover{transform:translateY(-3px);border-color:var(--line2)}
.theme.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 16px 40px -18px rgba(52,211,153,.6)}
.theme .pv{aspect-ratio:16/9;background:#05080F center/cover;position:relative;display:grid;place-items:center;color:var(--faint)}
.theme .pv svg{width:40px;height:40px}
.theme .pv .tag{left:10px;top:10px}
.theme .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ttabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tcbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.theme .bd small.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.theme .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.theme .bd b{font-size:16px;font-weight:720;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme .bd small{font:500 11.5px var(--mono);color:var(--faint)}
.theme .bd .acts{display:flex;gap:8px;margin-top:auto}
.maker{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
.maker canvas,.maker .ph{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line2);background:#05080F;display:block}
.maker .ph{display:grid;place-items:center;color:var(--faint);text-align:center;padding:16px;cursor:pointer;border-style:dashed}
.maker .f{display:flex;flex-direction:column;gap:12px}
.maker label{font:700 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.maker .in{width:100%}
.maker .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.maker p{margin:0;color:var(--dim);font-size:13px}
@media (max-width:760px){.maker{grid-template-columns:1fr}}

/* ------------------------------------------------------------ overlays */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.25s;z-index:80;
  padding:11px 18px;border-radius:13px;background:rgba(15,21,37,.97);border:1px solid var(--line2);font-weight:620;max-width:92vw;box-shadow:0 20px 50px -20px #000}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.err{border-color:var(--bad);color:#FCA5A5}
dialog{border:1px solid var(--line2);border-radius:18px;background:var(--solid);color:var(--text);padding:22px;max-width:min(460px,92vw);width:100%;box-shadow:0 40px 90px -30px #000}
dialog::backdrop{background:rgba(4,6,12,.72);backdrop-filter:blur(4px)}
dialog h4{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
dialog p{margin:0 0 16px;color:var(--dim);word-break:break-word}
dialog .in{width:100%;margin-bottom:16px}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
dialog.wide{max-width:min(980px,96vw)}
dialog textarea{width:100%;height:min(60vh,560px);resize:vertical;font:500 12.5px/1.55 var(--mono);background:#070A12;border:1px solid var(--line2);border-radius:12px;padding:14px;outline:none;margin-bottom:16px;tab-size:2}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:70;transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(4,6,12,.6)}
  .btn.burger{display:inline-flex}
  .bar{padding:12px 14px;position:sticky;top:0;z-index:20}
  .view{padding:16px 14px 70px;overflow:visible}
  .tw{max-height:none}
  table.t td.a .btn{opacity:1}
  .hide-m{display:none}
}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hero .c{flex-wrap:wrap}.hero .cv{width:86px;height:86px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:14px 10px}
  .srch .in{width:100%}.srch{flex:1}
  .item{flex-wrap:wrap}.item .acts{width:100%;justify-content:flex-end}
  .cover .go{opacity:1;transform:none}
  .bar p{display:none}
}

/* ============================================================ NEO skin (rc7)
 * A layer over the base styles: deeper space, neon hairlines, HUD corners,
 * an animated aurora and a perspective grid. Every colour still comes from
 * --blue/--cyan/--violet, so the accent setting keeps working. */
:root{
  --bg:#04060D; --panel:rgba(12,17,32,.62); --solid:#0A0F1E;
  --line:rgba(120,160,255,.13); --line2:rgba(120,160,255,.24);
  --r:18px;
  --ui:"Space Grotesk",Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
  --glow:0 0 0 1px rgba(77,208,255,.28),0 0 28px -6px rgba(77,208,255,.45);
}
body{font-family:var(--ui);letter-spacing:-.005em}
body::before{
  background:
    radial-gradient(1200px 700px at 12% -18%,color-mix(in srgb,var(--cyan) 26%,transparent),transparent 62%),
    radial-gradient(1000px 680px at 108% 0%,color-mix(in srgb,var(--violet) 24%,transparent),transparent 62%),
    radial-gradient(800px 520px at 55% 120%,color-mix(in srgb,var(--blue) 16%,transparent),transparent 62%);
  animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-2%,1.5%,0) scale(1.05)}100%{transform:translate3d(2%,-1%,0) scale(1.02)}}
body::after{content:"";position:fixed;left:-50%;right:-50%;bottom:-8vh;height:46vh;z-index:0;pointer-events:none;opacity:.55;
  background:
    linear-gradient(color-mix(in srgb,var(--cyan) 22%,transparent) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(90deg,color-mix(in srgb,var(--cyan) 22%,transparent) 1px,transparent 1px) 0 0/64px 64px;
  transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0,transparent 92%);mask-image:linear-gradient(to top,#000 0,transparent 92%);
  animation:gridrun 6s linear infinite}
@keyframes gridrun{to{background-position:0 64px,0 0}}
html.plain body::after{display:none}

/* glass with a neon hairline: the border is a gradient, the fill stays glass */
.card{border:1px solid transparent;
  background:
    linear-gradient(var(--panel),var(--panel)) padding-box,
    linear-gradient(140deg,color-mix(in srgb,var(--cyan) 42%,transparent),rgba(120,160,255,.10) 32%,rgba(120,160,255,.07) 68%,color-mix(in srgb,var(--violet) 40%,transparent)) border-box;
  box-shadow:0 30px 60px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
/* HUD corners on the tiles */
.kpi,.stk,.cfg .card{
  background:
    linear-gradient(var(--cyan),var(--cyan)) left 8px top 8px/12px 1.5px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) left 8px top 8px/1.5px 12px no-repeat,
    linear-gradient(var(--violet),var(--violet)) right 8px bottom 8px/12px 1.5px no-repeat,
    linear-gradient(var(--violet),var(--violet)) right 8px bottom 8px/1.5px 12px no-repeat,
    linear-gradient(var(--panel),var(--panel)) padding-box,
    linear-gradient(140deg,color-mix(in srgb,var(--cyan) 42%,transparent),rgba(120,160,255,.08) 40%,color-mix(in srgb,var(--violet) 36%,transparent)) border-box}
.card.kpi:hover,.stk:hover{box-shadow:var(--glow);transition:box-shadow .25s}

/* sidebar */
.side{background:linear-gradient(180deg,rgba(8,12,24,.86),rgba(5,8,16,.92));border-right:1px solid var(--line)}
.side::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--cyan),var(--violet),transparent);opacity:.55}
@media (min-width:901px){.side{position:relative}}
.logo{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--cyan) 70%,transparent));animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 28px color-mix(in srgb,var(--violet) 80%,transparent))}}
.ps{background:linear-gradient(135deg,rgba(77,208,255,.06),rgba(142,123,255,.05));border-color:var(--line2)}
.ps.ok .r1 i{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(52,211,153,.18)}50%{box-shadow:0 0 0 7px rgba(52,211,153,.05)}}
nav button{border-radius:12px;transition:background .18s,color .18s,transform .18s}
nav button:hover{transform:translateX(3px)}
nav button.on{background:linear-gradient(100deg,color-mix(in srgb,var(--cyan) 22%,transparent),color-mix(in srgb,var(--violet) 14%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 30%,transparent),0 10px 30px -18px var(--cyan)}
nav button.on svg{filter:drop-shadow(0 0 6px var(--cyan))}
nav h6{color:color-mix(in srgb,var(--cyan) 55%,#5C6889)}

/* top bar */
.bar{position:relative;background:rgba(4,6,13,.5)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan) 30%,var(--violet) 70%,transparent);opacity:.7}
.bar h1{font-size:23px;font-weight:700;letter-spacing:-.03em;
  background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--cyan) 60%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
#clock{font-family:var(--mono);border-color:color-mix(in srgb,var(--cyan) 35%,transparent);color:color-mix(in srgb,var(--cyan) 70%,#fff)}
.kbtn{display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(9,13,26,.7);color:var(--dim);font-weight:600;cursor:pointer;transition:.15s}
.kbtn:hover{border-color:var(--cyan);color:var(--text);box-shadow:var(--glow)}
.kbtn kbd{font:600 10.5px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--faint)}

/* atoms */
h3.h{color:color-mix(in srgb,var(--cyan) 45%,var(--dim))}
h3.h::before{width:14px;height:2px;border-radius:2px;box-shadow:0 0 10px var(--cyan)}
.btn{border-radius:12px;background:rgba(10,15,30,.7)}
.btn:hover{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);box-shadow:0 0 20px -8px var(--cyan)}
.btn.pri{position:relative;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 50%,transparent),0 12px 32px -12px var(--cyan)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,70%{left:-60%}100%{left:130%}}
.in{background:rgba(6,10,22,.75)}
.in:focus{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 18%,transparent),0 0 24px -8px var(--cyan)}
.chip{background:rgba(6,10,22,.45)}
.prog{background:rgba(120,160,255,.12)}
.prog i{box-shadow:0 0 12px color-mix(in srgb,var(--cyan) 70%,transparent)}
.note{border-radius:14px;backdrop-filter:blur(10px)}
/* what the gamepad or the keyboard is on: plain to see on a TV */
:focus-visible{outline:2px solid var(--cyan)!important;outline-offset:3px;border-radius:12px;box-shadow:0 0 0 6px color-mix(in srgb,var(--cyan) 18%,transparent),0 0 30px -4px var(--cyan)!important}

/* dashboard */
.hero{border-color:transparent}
.hero h2{font-weight:700;letter-spacing:-.04em;text-shadow:0 0 40px color-mix(in srgb,var(--cyan) 35%,transparent)}
.hero .c::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.0;animation:scan 7s ease-in-out infinite}
@keyframes scan{0%{top:0;opacity:0}10%{opacity:.25}90%{opacity:.25}100%{top:100%;opacity:0}}
.hero .c{position:relative}
.kpi b{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--cyan) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.kpi .k svg{filter:drop-shadow(0 0 6px var(--cyan))}
.stk b{font-weight:700}
.qa button{border-radius:14px}
.qa button:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.ring .ar{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--cyan) 70%,transparent))}

/* library */
.cover{border-radius:16px}
.game:hover .cover,.game:focus-within .cover{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 22px 48px -18px var(--cyan)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-100%);transition:transform .7s}
.game:hover .cover::after{transform:translateX(100%)}

/* views come in with a short focus pull */
.view>section{animation:inx .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes inx{from{opacity:0;transform:translateY(10px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 40%,transparent),color-mix(in srgb,var(--violet) 40%,transparent));background-clip:content-box}
.toast{border-color:color-mix(in srgb,var(--cyan) 40%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 30px -8px var(--cyan),0 20px 50px -20px #000}

html.tv{font-size:16px}html.tv .btn{padding:11px 18px}html.tv nav button{padding:13px 14px}
.bell{position:relative}.bell em{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font:700 10px/17px var(--mono);font-style:normal;text-align:center;color:#06101F;background:var(--grad);box-shadow:0 0 12px var(--cyan)}
#evp{position:fixed;top:66px;right:18px;z-index:90;width:min(400px,94vw);max-height:70vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:var(--glow),0 30px 70px -20px #000}
#evp .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#evp .hd b{flex:1}
#evp .ls{overflow:auto}
#evp .ev{display:flex;gap:11px;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
#evp .ev:first-child{border-top:0}
#evp .ev i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#evp .ev.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}#evp .ev.bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}#evp .ev.warn i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
#evp .ev.old{opacity:.6}
#evp .ev small{display:block;font:500 11px var(--mono);color:var(--faint);margin-top:2px}
.cfg .seg{flex-wrap:wrap;max-width:100%}
.tabs{display:none}
.drawer{overflow:hidden}
#v-smp label.sw{white-space:normal;align-items:flex-start}
@media (max-width:900px){.bar{gap:6px}.bar>div:nth-child(2){min-width:0;flex:1}.bar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .sp{display:none}
  .kbtn kbd,.kbtn span{display:none}.kbtn{padding:8px;border-color:transparent;background:transparent}}
@media (max-width:620px){.hero .t{flex:1 1 calc(100% - 110px)}.hero .acts{flex:1 1 100%}.hero .acts .btn{flex:1}.hero h2{font-size:28px}}
@media (max-width:900px){
  .tabs{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;padding:6px;gap:4px;border-radius:20px;
    background:rgba(8,12,24,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:var(--glow),0 20px 40px -10px #000}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:14px;background:transparent;color:var(--dim);font:600 10.5px var(--ui)}
  .tabs button svg{width:21px;height:21px}
  .tabs button.on{color:var(--text);background:linear-gradient(160deg,color-mix(in srgb,var(--cyan) 24%,transparent),color-mix(in srgb,var(--violet) 18%,transparent))}
  .tabs button.on svg{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
  .view{padding-bottom:110px}
  .toast{bottom:96px}
}
dialog.news h4{display:flex;align-items:center;gap:10px}
dialog.news .md{max-height:62vh;overflow:auto;margin:6px 0 18px;padding-right:6px;color:var(--dim);font-size:14px}
dialog.news .md h3,dialog.news .md h4,dialog.news .md h5{color:var(--text);margin:18px 0 8px;font-size:15px}
dialog.news .md h3{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--cyan) 60%,#fff)}
dialog.news .md ul{margin:6px 0;padding-left:20px}dialog.news .md li{margin:4px 0}
dialog.news .md b{color:var(--text)}dialog.news .md code{font:500 12.5px var(--mono);padding:1px 6px;border-radius:6px;background:rgba(120,160,255,.12)}
dialog.news .md a{color:var(--cyan)}dialog.news .md p{margin:8px 0}
/* command palette */
#cmdk{position:fixed;inset:0;z-index:130;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;background:rgba(3,5,11,.66);backdrop-filter:blur(6px)}
#cmdk .box{width:min(640px,94vw);border-radius:18px;overflow:hidden;box-shadow:var(--glow),0 40px 90px -30px #000}
#cmdk input{width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:18px 20px;font-size:17px;outline:none}
#cmdk .ls{max-height:56vh;overflow:auto;padding:6px}
#cmdk .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--dim)}
#cmdk .it img{width:28px;height:28px;border-radius:7px;object-fit:cover}
#cmdk .it b{color:var(--text);font-weight:600}#cmdk .it small{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
#cmdk .it.on{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 35%,transparent)}
#cmdk .ft{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--faint)}

/* Remote Play */
.rpu{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rpc{padding:18px;display:flex;flex-direction:column;gap:12px}
.rpc .hd{display:flex;align-items:center;gap:12px}
.rpc .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06101F;background:var(--grad);box-shadow:0 0 22px -6px var(--cyan)}
.rpc .hd b{display:block;font-size:16px}.rpc .hd small{font:500 11.5px var(--mono);color:var(--faint)}
.rpc code{display:block;font:600 15px var(--mono);padding:10px 12px;border-radius:10px;background:rgba(4,7,16,.7);border:1px solid var(--line2);word-break:break-all}
.pin{font:700 clamp(40px,7vw,64px)/1 var(--mono);letter-spacing:.18em;text-align:center;padding:18px 0 8px;
  background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--cyan) 45%,transparent))}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding:14px 14px 14px 52px;border-radius:14px;border:1px solid var(--line);background:rgba(8,12,24,.5);color:var(--dim);font-size:13.5px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);color:#06101F;background:var(--grad)}
.steps li b{color:var(--text)}

/* ============================================================ NEO v2 — "holo"
 * Particle field, cinematic boot, holographic cards, HUD gauges. Every effect
 * stands down with "Animations" off, "plain", or reduced motion. */
:root{--disp:"Orbitron","Space Grotesk",var(--ui)}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
html.noanim #fx,html.plain #fx{display:none}
/* the cursor carries a soft light over the page */
body{--px:50%;--py:30%}
.app::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px circle at var(--px) var(--py),color-mix(in srgb,var(--cyan) 9%,transparent),transparent 60%)}
.main{position:relative;z-index:1}
@media (min-width:901px){.side{z-index:2}}
/* boot */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0a1430,#020308 70%);transition:opacity .6s,visibility .6s}
#boot.out{opacity:0;visibility:hidden}
#boot .core{display:flex;flex-direction:column;align-items:center;gap:22px}
#boot img{width:110px;height:110px;filter:drop-shadow(0 0 30px var(--cyan)) drop-shadow(0 0 60px var(--violet));animation:bootlogo 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes bootlogo{0%{opacity:0;transform:scale(.6) rotate(-8deg);filter:blur(10px)}60%{opacity:1;filter:blur(0) drop-shadow(0 0 40px var(--cyan))}100%{transform:none}}
#boot .ring{position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);
  box-shadow:0 0 40px -10px var(--cyan) inset,0 0 40px -10px var(--violet);animation:bootring 2.4s linear infinite}
#boot .ring.b{width:330px;height:330px;border-style:dashed;opacity:.5;animation-duration:7s;animation-direction:reverse}
@keyframes bootring{to{transform:rotate(360deg)}}
#boot b{font:800 15px var(--disp);letter-spacing:.5em;color:#fff;text-shadow:0 0 18px var(--cyan)}
#boot small{font:500 11px var(--mono);letter-spacing:.3em;color:color-mix(in srgb,var(--cyan) 70%,#fff);min-height:14px}
#boot .bb{width:220px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
#boot .bb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan);animation:bootbar 1.3s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes bootbar{to{width:100%}}
/* spotlight inside every card, following the cursor */
.card{position:relative;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--cyan) 13%,transparent),transparent 65%)}
.card:hover::before{opacity:1}
/* the hero: a rotating neon frame, HUD ticks, a cover that floats */
.holo{position:relative;border-radius:22px;padding:1.5px;
  background:conic-gradient(from var(--ang),transparent 0 18%,var(--cyan) 26%,transparent 34% 52%,var(--violet) 62%,transparent 70%),linear-gradient(140deg,rgba(120,160,255,.18),rgba(120,160,255,.06));
  animation:spin 7s linear infinite;box-shadow:0 0 60px -30px var(--cyan),0 30px 80px -50px #000}
@keyframes spin{to{--ang:360deg}}
.holo>.hero{border-radius:21px;margin:0;border:0;background:linear-gradient(160deg,rgba(10,16,34,.92),rgba(6,9,20,.94))}
.hero{min-height:270px}
.hero .c{padding:30px}
.hero h2{font-family:var(--disp);font-weight:800;letter-spacing:.01em;font-size:clamp(24px,3.2vw,44px);
  background:linear-gradient(92deg,#fff 30%,color-mix(in srgb,var(--cyan) 70%,#fff) 70%,color-mix(in srgb,var(--violet) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .cv{transform-style:preserve-3d;transition:transform .25s;box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 30%,transparent),0 30px 60px -20px #000,0 0 50px -20px var(--cyan);-webkit-box-reflect:below 8px linear-gradient(transparent 70%,rgba(255,255,255,.12))}
.hero .tick{position:absolute;z-index:2;font:600 10px var(--mono);letter-spacing:.2em;color:color-mix(in srgb,var(--cyan) 70%,#fff);opacity:.75}
.hero .tick.tl{top:14px;left:18px}.hero .tick.tr{top:14px;right:18px}
.hero .tick::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border:1px solid currentColor;transform:rotate(45deg);vertical-align:1px}
.kick{font-family:var(--disp);letter-spacing:.24em}
[data-tilt]{transition:transform .2s ease-out;transform-style:preserve-3d;will-change:transform}
/* KPI tiles: big display numbers, a gauge ring on the right */
.kpi{display:flex;flex-direction:column;min-height:132px}
.kpi b{font-family:var(--disp);font-weight:800;font-size:32px;letter-spacing:.02em}
.kpi b small{font-family:var(--mono)}
.kpi .gauge{position:absolute;right:14px;top:16px;width:64px;height:64px}
.kpi .gauge svg{width:64px;height:64px;transform:rotate(135deg);overflow:visible}
.kpi .gauge circle{fill:none;stroke-width:5;stroke-linecap:round}
.kpi .gauge .tr{stroke:rgba(120,160,255,.13)}
.kpi .gauge .ar{filter:drop-shadow(0 0 5px currentColor);transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.kpi.has-g .m{display:none}
.kpi.has-g b{margin-right:70px}
.first .kpi .gauge .ar{animation:gauge 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes gauge{from{stroke-dasharray:0 999}}
.first .kpi,.first .g2>.card,.first .g3>.card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.first .kpi:nth-child(2){animation-delay:.06s}.first .kpi:nth-child(3){animation-delay:.12s}.first .kpi:nth-child(4){animation-delay:.18s}.first .kpi:nth-child(5){animation-delay:.24s}
.first .g2>.card{animation-delay:.28s}.first .g3>.card{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
/* chart and rings glow */
.chart svg path,.chart svg polyline{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--cyan) 60%,transparent))}
.ring span{font-family:var(--disp);font-size:11px}
/* top bar HUD: live CPU / SoC / fan */
.hud{display:flex;gap:6px;align-items:center}
.hud .m{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,10,22,.6);font:600 11.5px var(--mono);color:var(--dim)}
.hud .m svg{width:24px;height:24px;transform:rotate(-90deg)}
.hud .m circle{fill:none;stroke-width:3.5}
.hud .m .tr{stroke:rgba(120,160,255,.15)}
.hud .m .ar{stroke-linecap:round;transition:stroke-dasharray .6s;filter:drop-shadow(0 0 3px currentColor)}
.hud .m b{color:var(--text);font-weight:700}
@media (max-width:1100px){.hud{display:none}}
/* sidebar: a neon dock */
nav button svg{transition:transform .2s,filter .2s}
nav button:hover svg{transform:scale(1.15);filter:drop-shadow(0 0 6px var(--cyan))}
nav button.on em{margin-right:12px}
nav button.on::after{content:"";position:absolute;right:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan)}
.brand .word{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--cyan) 50%,transparent))}
/* titles decode in */
.bar h1{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:20px;text-transform:uppercase}
.bar p{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
h3.h{font-family:var(--disp);font-weight:600;letter-spacing:.24em;font-size:10.5px}
h3.h{flex-wrap:wrap;row-gap:6px}
@media (max-width:620px){h3.h{letter-spacing:.14em}.kpi b{font-size:26px}.kpi .gauge{top:auto;bottom:14px;right:12px;width:46px;height:46px}.kpi .gauge svg{width:46px;height:46px}.kpi.has-g b{margin-right:0}}
.tabs button.on::after{display:none}.tabs button:hover{transform:none}
/* library covers: glare and float */
.cover{transform-style:preserve-3d}
.game .cover::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(300px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.28),transparent 45%)}
.game:hover .cover::before{opacity:1}
.game b{font-weight:600}
/* buttons: holographic edge */
.btn.pri{background:linear-gradient(110deg,var(--cyan),var(--blue) 40%,var(--violet));background-size:200% 100%;transition:background-position .5s,transform .12s,filter .15s}
.btn.pri:hover{background-position:100% 0}
.btn:not(.pri):not(.ghost):not(.danger){background:linear-gradient(rgba(10,15,30,.75),rgba(10,15,30,.75)) padding-box,linear-gradient(120deg,color-mix(in srgb,var(--cyan) 45%,transparent),rgba(120,160,255,.15),color-mix(in srgb,var(--violet) 45%,transparent)) border-box;border-color:transparent}
/* the selected section in the bottom bar and side menu pulses once */
nav button.on,.tabs button.on{animation:pick .5s ease-out}
@keyframes pick{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cyan) 50%,transparent)}100%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 30%,transparent),0 0 0 12px transparent}}
html.noanim .holo{animation:none}
@media (prefers-reduced-motion:reduce){#fx{display:none}.holo{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ============================================================ lite
 * The PS5's own browser draws all of the above at a few frames a second: on
 * the console (html.lite) the particles, blur, glows, shadows, the cursor
 * light and every animation are off, and the page only repaints what changed. */
html.lite #fx,html.lite .app::before,html.lite .app::after{display:none!important}
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;filter:none!important;
  box-shadow:none!important;text-shadow:none!important;will-change:auto!important}
html.lite .card::before,html.lite .card::after,html.lite .cover::after,html.lite .holo::before,html.lite .holo::after{display:none!important}
html.lite :focus-visible{box-shadow:none!important;outline:3px solid var(--cyan)!important}
</style>
<script>/* lite: what the console's browser can draw smoothly; ?lite=0 or ?lite=1 forces it */
if(/[?&]lite=1/.test(location.search)||/PlayStation/i.test(navigator.userAgent)&&!/[?&]lite=0/.test(location.search))document.documentElement.classList.add("lite");</script>

S.ups=[];var upBusy=false,CH=256*1048576,raf=0;
function upState(u){
  if(u.st==="wait")return L("En cola","Queued")+" · "+size(u.size);
  if(u.st==="ok")return L("Completado","Done")+" · "+size(u.size)+(u.resumed?" · "+L("reanudado","resumed"):"");
  if(u.st==="err")return "Error: "+u.err;
  if(u.st==="cancel")return L("Cancelado","Cancelled");
  if(u.st==="skip")return L("Omitido","Skipped");
  var sent=u.done+(u.cur||0),el=(Date.now()-u.t0)/1000,sp=el>0?(sent-u.base)/el:0;
  return size(sent)+" / "+size(u.size)+" · "+size(sp)+"/s"+(sp>0?" · "+dur((u.size-sent)/sp):"")+(u.retry?" · "+L("reintento ","retry ")+u.retry:"");
}
function enqueue(list,dir){
  if(!list.length)return;
  list.forEach(function(x){S.ups.push({f:x.file,name:x.rel,dest:pj(dir,x.rel),size:x.file.size,done:0,cur:0,base:0,st:"wait"})});
  toast(list.length+" "+L("en cola para ","queued for ")+dir);paintNav();if(S.view==="transfers")paintTr();pump();
}
function pump(){
  if(upBusy)return;var u=S.ups.filter(function(x){return x.st==="wait"})[0];
  if(!u){if(S.view==="files")loadDir(S.cwd);paintNav();return}
  upBusy=true;runUp(u).then(function(){upBusy=false;tick();pump()});
}
function tick(){if(raf)return;raf=setTimeout(function(){raf=0;paintNav();if(S.view==="transfers")paintTr();else if(S.view==="panel")paintPanel()},400)}
function stat(p){return api("/api/fs/stat?path="+enc(p))}
function runUp(u){
  u.st="run";u.t0=Date.now();
  return stat(u.dest).then(function(s){
    if(s.exists&&s.type==="file"&&s.size>0&&s.size<u.size){u.done=u.base=s.size;u.resumed=true;return true}
    if(s.exists)return ask(L("Ya existe ","Already there: ")+u.name,L("¿Sustituirlo por el que estás subiendo?","Replace it with the one you are uploading?"),L("Sustituir","Replace"),true);
    return true},function(){return true})
  .then(function(go){if(!go){u.st="skip";return}u.t0=Date.now();return loop(u,0).then(function(){if(u.st==="run"){u.st="ok";note("ok",L("Subido: ","Uploaded: ")+u.name,u.dest);if(u.after)u.after()}})})
  .catch(function(e){u.st="err";u.err=e.message;note("bad",L("Subida fallida: ","Upload failed: ")+u.name,e.message)});
}
function loop(u,tries){
  if(u.cancel){u.st="cancel";return Promise.resolve()}
  if(u.done>=u.size&&(u.size>0||u.sent))return Promise.resolve();
  var end=Math.min(u.size,u.done+CH);
  return put(u,u.f.slice(u.done,end),u.done===0).then(function(){u.done=end;u.cur=0;u.sent=true;u.retry=0;tick();return loop(u,0)},
    function(e){u.cur=0;if(e.fatal||u.cancel||tries>=8){if(u.cancel){u.st="cancel";return}throw e}
      u.retry=tries+1;tick();
      return wait(1500*(tries+1)).then(function(){return stat(u.dest)}).then(function(s){if(s.exists)u.done=Math.min(s.size,end)},function(){}).then(function(){return loop(u,tries+1)})});
}
function put(u,blob,first){return new Promise(function(res,rej){
  var x=new XMLHttpRequest();u.xhr=x;
  x.open("PUT","/fs/put?path="+enc(u.dest)+"&size="+u.size+(first?"":"&offset="+u.done));
  x.upload.onprogress=function(e){u.cur=e.loaded;tick()};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(_){}
    if(x.status===200&&j.ok!==false)return res();
    var er=new Error(j.error||("HTTP "+x.status));er.fatal=[400,403,404,507].indexOf(x.status)>=0;rej(er)};
  x.onerror=x.onabort=function(){rej(new Error(L("Sin conexión","Connection lost")))};
  x.send(blob)})}
function gather(items){
  var out=[],ps=[];
  function walk(e,pre){return new Promise(function(res){
    if(e.isFile)e.file(function(f){out.push({file:f,rel:pre+f.name});res()},res);
    else{var r=e.createReader(),all=[];(function rd(){r.readEntries(function(l){
      if(!l.length)Promise.all(all.map(function(c){return walk(c,pre+e.name+"/")})).then(res);else{all=all.concat([].slice.call(l));rd()}},res)})()}})}
  [].forEach.call(items,function(it){var e=it.webkitGetAsEntry&&it.webkitGetAsEntry();
    if(e)ps.push(walk(e,""));else{var f=it.getAsFile&&it.getAsFile();if(f)out.push({file:f,rel:f.name})}});
  return Promise.all(ps).then(function(){return out});
}
function picked(inp){enqueue([].map.call(inp.files,function(f){return{file:f,rel:f.webkitRelativePath||f.name}}),S.cwd);inp.value=""}
$("pick-f").onchange=function(){picked(this)};$("pick-d").onchange=function(){picked(this)};
$("dz-t").textContent=L("Suelta para subir","Drop to upload");
var dzN=0;
function dzOn(){return S.full&&(S.view==="files"||S.view==="transfers"||S.view==="panel")}
window.addEventListener("dragenter",function(e){if(!dzOn()||!e.dataTransfer||[].indexOf.call(e.dataTransfer.types,"Files")<0)return;e.preventDefault();dzN++;
  $("dz-s").textContent=L("Destino: ","To: ")+S.cwd;$("dropz").className="dropz on"});
window.addEventListener("dragover",function(e){if(dzOn())e.preventDefault()});
window.addEventListener("dragleave",function(){if(--dzN<=0){dzN=0;$("dropz").className="dropz"}});
window.addEventListener("drop",function(e){dzN=0;$("dropz").className="dropz";
  if(!dzOn()||!e.dataTransfer||e.target.closest("#pdrop"))return;e.preventDefault();
  var dir=S.cwd;gather(e.dataTransfer.items).then(function(l){enqueue(l,dir)})});

/* ------------------------------------------------------------ transfers */
function loadJobs(){if(!S.full)return Promise.resolve();return api("/api/jobs").then(function(j){S.jobs=j.jobs||[];evJobs(S.jobs);paintNav();if(S.view==="transfers")paintTr()}).catch(function(){})}
function watchJob(id,cb){(function p(){api("/api/jobs?id="+id).then(function(j){if(j.job.state==="running")setTimeout(p,700);else{loadJobs();cb(j.job)}}).catch(fail)})()}
function paintTr(){
  var ups=S.ups.slice().reverse().map(function(u){var i=S.ups.indexOf(u),pct=u.size?Math.round((u.done+(u.cur||0))/u.size*100):(u.st==="ok"?100:0);
    return '<div class="item"><i class="dot'+(u.st==="run"?" on":"")+'"></i><div class="t"><b title="'+esc(u.dest)+'">'+esc(u.name)+'</b><small>'+esc(u.dest)+" · "+esc(upState(u))+'</small>'+
      (u.st==="run"||u.st==="wait"?'<div class="prog"><i style="width:'+pct+'%"></i></div>':u.st==="ok"?'<div class="prog ok"><i style="width:100%"></i></div>':u.st==="err"?'<div class="prog bad"><i style="width:'+pct+'%"></i></div>':"")+'</div>'+
      '<div class="acts">'+(u.st==="run"||u.st==="wait"?'<span class="chip">'+pct+'%</span><button class="btn sm danger" data-uc="'+i+'">'+L("Cancelar","Cancel")+'</button>'
        :u.st==="err"||u.st==="cancel"?'<button class="btn sm" data-ur="'+i+'">'+L("Reanudar","Resume")+'</button>':'<span class="chip ok">OK</span>')+'</div></div>'}).join("");
  var jobs=S.jobs.slice().reverse().map(function(j){var pct=j.bytesTotal?Math.round(j.bytesDone/j.bytesTotal*100):(j.state==="done"?100:0);
    return '<div class="item"><i class="dot'+(j.state==="running"?" on":"")+'"></i><div class="t"><b>'+esc(j.title)+'</b><small>'+esc(j.type)+" · "+
      (j.state==="running"?size(j.bytesDone)+" / "+size(j.bytesTotal)+(j.current?" · "+esc(j.current):""):j.state==="done"?(j.result?esc(j.result):L("terminada","finished")):esc(j.error||j.state))+'</small>'+
      '<div class="prog '+(j.state==="done"?"ok":j.state==="running"?"":"bad")+'"><i style="width:'+pct+'%"></i></div></div>'+
      '<div class="acts">'+(j.state==="running"?'<button class="btn sm danger" data-jc="'+j.id+'">'+L("Cancelar","Cancel")+'</button>':'<span class="chip '+(j.state==="done"?"ok":"bad")+'">'+esc(j.state)+'</span>')+'</div></div>'}).join("");
  $("v-transfers").innerHTML='<div class="tools"><h3 class="h" style="margin:0">'+L("Subidas desde este navegador","Uploads from this browser")+' <em>'+S.ups.length+'</em></h3><span class="sp"></span>'+
    '<button class="btn sm ghost" data-a="clr">'+L("Limpiar terminadas","Clear finished")+'</button><button class="btn pri" data-a="up">'+ic("upload")+L("Subir ficheros","Upload files")+'</button></div>'+
    '<div class="card">'+(ups||'<div class="empty">'+ic("upload")+'<div>'+L("Arrastra ficheros o carpetas a la ventana para subirlos a ","Drop files or folders on the window to upload them to ")+esc(S.cwd)+'<br><small>'+
      L("Las subidas van por trozos: si se corta la conexión, continúan donde iban.","Uploads go in chunks: if the connection drops, they continue where they were.")+'</small></div></div>')+'</div>'+
    '<div class="tools" style="margin-top:24px"><h3 class="h" style="margin:0">'+L("Tareas en la consola","Console jobs")+' <em>'+S.jobs.length+'</em></h3><span class="sp"></span>'+
    '<button class="btn sm ghost" data-a="jclr">'+L("Limpiar","Clear")+'</button></div><div class="card">'+(jobs||'<div class="empty">'+L("Copias, movimientos y comprobaciones aparecerán aquí.","Copies, moves and checks will show up here.")+'</div>')+'</div>';
}
$("v-transfers").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v;
  if((v=b.getAttribute("data-uc"))!=null){var u=S.ups[v];u.cancel=true;if(u.st==="wait")u.st="cancel";if(u.xhr)u.xhr.abort();tick()}
  else if((v=b.getAttribute("data-ur"))!=null){var r=S.ups[v];r.cancel=false;r.st="wait";r.err="";r.retry=0;paintTr();pump()}
  else if((v=b.getAttribute("data-jc")))api("/api/jobs/cancel",{id:+v}).then(loadJobs).catch(fail);
  else if((v=b.getAttribute("data-a"))==="up")$("pick-f").click();
  else if(v==="clr"){S.ups=S.ups.filter(function(u){return u.st==="run"||u.st==="wait"});paintTr();paintNav()}
  else if(v==="jclr")api("/api/jobs/clear",{}).then(loadJobs).catch(fail)});
window.addEventListener("beforeunload",function(e){if(S.ups.some(function(u){return u.st==="run"||u.st==="wait"})){e.preventDefault();e.returnValue=""}});

var pbusy=false;
function loadPay(){return api("/api/payloads/list").then(function(j){S.pay=j.payloads||[];S.ro=!!j.readOnly;S.payDir=j.dir||"";paintNav();if(S.view==="payloads"&&!pbusy)paintPay()}).catch(function(){})}
function paintPay(){
  var dis=S.ro?" disabled":"";
  $("v-payloads").innerHTML=(S.ro?'<div class="note">'+L("NeoWEB está en solo lectura: existe /data/neohen/web/readonly en la consola.","NeoWEB is read-only: /data/neohen/web/readonly exists on the console.")+'</div>':"")+
    '<div class="drop" id="pdrop"><div class="ico">'+ic("upload")+'</div><div class="tx"><b>'+L("Enviar un payload","Send a payload")+'</b><span id="pup">'+
    L("Arrastra aquí un .elf o .bin, o elige un fichero. Se guarda en la consola.","Drop an .elf or .bin here, or pick a file. It is saved on the console.")+'</span><div class="prog" id="pprog" hidden style="margin-top:9px"><i></i></div></div>'+
    '<button class="btn pri" id="ppick"'+dis+'>'+L("Elegir fichero","Choose file")+'</button></div>'+
    '<h3 class="h">'+L("Instalados","Installed")+' <em>'+esc(S.payDir)+'</em></h3><div class="card">'+(S.pay.length?S.pay.map(function(p){var n=esc(p.name);
      return '<div class="item"><i class="dot'+(p.running?" on":"")+'"></i><div class="t"><b title="'+n+'">'+n+(p.bundled?'<span class="badge">'+L("de NeoHEN","NeoHEN's")+'</span>':"")+(p.self?'<span class="badge ok">'+L("este servicio","this service")+'</span>':"")+'</b>'+
        '<small>'+size(p.size)+" · "+(p.running?L("en marcha","running")+" · pid "+p.pid:L("parado","stopped"))+" · "+L("prioridad ","priority ")+p.priority+'</small></div>'+
        '<div class="acts"><label class="sw"><input type="checkbox" data-auto="'+n+'"'+(p.autoStart?" checked":"")+dis+'><i></i>'+L("Al arrancar","On boot")+'</label>'+
        (p.running?'<button class="btn sm danger" data-stop="'+n+'"'+(p.self?" disabled":dis)+'>'+L("Parar","Stop")+'</button>':'<button class="btn sm pri" data-start="'+n+'"'+dis+'>'+L("Arrancar","Start")+'</button>')+
        '<button class="btn sm" data-del="'+n+'"'+(p.running?" disabled":dis)+'>'+L("Borrar","Delete")+'</button></div></div>'}).join("")
      :'<div class="empty">'+L("No hay payloads en la consola todavía.","No payloads on the console yet.")+'</div>')+'</div>'+(S.full?'<div id="stbox" style="margin-top:26px"></div>':"");
  paintStore();
  $("ppick").onclick=function(){$("pick-p").click()};
  var d=$("pdrop");
  ["dragenter","dragover"].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();if(!S.ro)d.className="drop over"})});
  ["dragleave","drop"].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.className="drop"})});
  d.addEventListener("drop",function(e){dzN=0;$("dropz").className="dropz";if(!S.ro&&e.dataTransfer)upPay(e.dataTransfer.files)});
}

S.st={rel:{},inst:{},busy:{},err:"",asked:false};
function loadStore(){
  if(!S.full)return Promise.resolve();
  var st=S.st;st.asked=true;st.err="";
  try{var c=JSON.parse(sessionStorage.getItem("nw-store")||"null");if(c&&Date.now()-c.t<36e5)st.rel=c.rel}catch(_){}
  var ps=[api("/api/store").then(function(j){st.inst=j.installed||{};st.upd=j.updates||[];storeNews(st.upd)}).catch(function(){}),
    api("/api/store/auto").then(function(j){st.auto=j.enabled}).catch(function(){})];
  STORE.forEach(function(x){if(st.rel[x[0]])return;
    ps.push(fetch("https://api.github.com/repos/"+x[2]+"/releases?per_page=1").then(function(r){if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}).then(function(j){
      var rl=j[0],a=rl&&rl.assets.filter(function(y){return x[3].test(y.name)})[0];if(a)st.rel[x[0]]={tag:rl.tag_name,url:a.browser_download_url,size:a.size,date:(rl.published_at||"").slice(0,10)}},
      function(e){st.err=e.message}))});
  return Promise.all(ps).then(function(){try{if(Object.keys(st.rel).length)sessionStorage.setItem("nw-store",JSON.stringify({t:Date.now(),rel:st.rel}))}catch(_){}if(S.view==="payloads")paintStore()});
}
function paintStore(){
  var box=$("stbox"),st=S.st;if(!box)return;
  var have={};S.pay.forEach(function(p){have[p.name]=p});
  box.innerHTML='<div class="tools"><h3 class="h" style="margin:0">'+L("Tienda de payloads","Payload store")+' <em>'+STORE.length+'</em></h3><span class="sp"></span><button class="btn sm ghost" id="st-re">'+ic("refresh")+L("Mirar versiones","Check versions")+'</button></div>'+
    '<div class="note" style="border-color:rgba(77,163,255,.4);background:rgba(77,163,255,.08);color:#CFE4FF">'+L("La consola descarga cada payload de la página de su autor en GitHub, a su carpeta de payloads. Hace falta que la consola tenga salida a internet. Uno que está en marcha sigue con la versión vieja hasta que lo pares y lo arranques.","The console downloads each payload from its author's page on GitHub, into its payloads folder. The console needs a way out to the internet. One that is running keeps the old version until you stop and start it.")+'</div>'+
    (st.err?'<div class="note">'+L("GitHub no ha contestado a todo: ","GitHub did not answer everything: ")+esc(st.err)+'</div>':"")+
    '<div class="card" style="margin-bottom:14px"><div class="item"><div class="t"><b>'+L("Actualizar solos los payloads de la tienda","Keep the store's payloads up to date by themselves")+'</b><small style="white-space:normal">'+
      L("NeoHEN mira GitHub al arrancar y cada 12 h y pone la versión nueva de los que instalaste desde aquí; se usa la próxima vez que arranquen. Los que pusiste a mano o vienen con NeoHEN no se tocan.","NeoHEN checks GitHub at start and every 12 h and puts the new release of the ones you installed from here; it is used the next time they start. The ones you put by hand or that come with NeoHEN are not touched.")+'</small></div>'+
      '<div class="acts"><label class="sw"><input type="checkbox" id="st-auto"'+(st.auto!==false?" checked":"")+(S.ro?" disabled":"")+'><i></i></label></div></div>'+
      ((st.upd||[]).length?(st.upd||[]).slice(0,5).map(function(u){return '<div class="item"><i class="dot on"></i><div class="t"><b>'+esc(u.name)+'</b><small>'+esc(u.from||"?")+" → "+esc(u.to)+" · "+new Date(u.time*1000).toLocaleString()+'</small></div><div class="acts"><span class="chip ok">'+L("actualizado solo","updated by itself")+'</span></div></div>'}).join(""):"")+'</div>'+
    '<div class="card">'+STORE.map(function(x){var n=x[0],r=st.rel[n],p=have[n],it=st.inst[n],busy=st.busy[n],same=p&&r&&it===r.tag;
      return '<div class="item"><i class="dot'+(p&&p.running?" on":"")+'"></i><div class="t"><b>'+esc(x[1])+'</b><small>'+esc(x[4])+' · <a href="https://github.com/'+x[2]+'" target="_blank" rel="noopener">'+x[2]+'</a></small></div>'+
        '<div class="acts">'+(r?'<span class="chip" title="'+esc(r.date)+'">'+esc(r.tag)+" · "+size(r.size)+'</span>':'<span class="chip">'+(st.asked&&st.err?"?":"…")+'</span>')+
        (p?'<span class="chip'+(same?" ok":it?" warn":"")+'">'+(same?L("al día","up to date"):it?L("tienes ","you have ")+esc(it):L("en la consola","on the console"))+'</span>':"")+
        (r&&!same?'<button class="btn sm'+(p?"":" pri")+'" data-store="'+n+'"'+(busy||S.ro?" disabled":"")+'>'+(busy?L("Descargando…","Downloading…"):p?L("Poner la ","Get ")+esc(r.tag):L("Instalar","Install"))+'</button>':"")+'</div></div>'}).join("")+'</div>';
}
function storeGet(n){
  var st=S.st,r=st.rel[n];if(!r||st.busy[n])return;st.busy[n]=1;paintStore();
  api("/api/store/fetch",{url:r.url,name:n,tag:r.tag}).then(function(j){delete st.busy[n];st.inst[n]=r.tag;toast(n+" "+r.tag+L(" descargado en la consola"," downloaded to the console")+" · "+size(j.bytes));return loadPay()},
    function(e){delete st.busy[n];fail(e);paintStore()});
}
function pact(path,body,before,after){
  toast(before);pbusy=true;
  return api(path,body).then(function(j){pbusy=false;toast(typeof after==="function"?after(j):after);return loadPay()}).catch(function(e){pbusy=false;fail(e);return loadPay()});
}
$("v-payloads").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;var n;
  if((n=b.getAttribute("data-store"))){storeGet(n);return}
  if(b.id==="st-re"){try{sessionStorage.removeItem("nw-store")}catch(_){}S.st.rel={};loadStore();return}
  if((n=b.getAttribute("data-start")))pact("/api/payloads/start",{name:n},L("Arrancando ","Starting ")+n+"…",function(j){return n+(j.running?L(" arrancado"," started"):L(" enviado al cargador; no ha dejado ningún proceso en marcha"," sent to the loader; it left no process running"))});
  else if((n=b.getAttribute("data-stop")))ask(L("Parar ","Stop ")+n,L("El proceso se cierra de inmediato. Si es un payload del que depende la consola, como ShadowMount+, dejará de hacer su trabajo hasta que lo arranques otra vez.","The process is closed at once. If the console relies on it, like ShadowMount+, it stops doing its job until you start it again."),L("Parar","Stop"),true).then(function(ok){if(ok)pact("/api/payloads/stop",{name:n},"…",n+L(" parado"," stopped"))});

/* RGBA 3840x2160 -> DXT1, in slices so the page keeps answering. */
function dxt1(px,W,H,step){return new Promise(function(done){

      for(y=0;y<4;y++){i=((by*4+y)*W+bx*4)*4;for(x=0;x<4;x++,i+=4){var r=px[i],g=px[i+1],b=px[i+2];
        if(r<r0)r0=r;if(g<g0)g0=g;if(b<b0)b0=b;if(r>r1)r1=r;if(g>g1)g1=g;if(b>b1)b1=b}}
      var c0=to565(r1,g1,b1),c1=to565(r0,g0,b0),bits=0;
      if(c0===c1){out[o]=c0&255;out[o+1]=c0>>8;out[o+2]=c1&255;out[o+3]=c1>>8;out[o+4]=out[o+5]=out[o+6]=out[o+7]=0;o+=8;continue}
      if(c0<c1){var t=c0;c0=c1;c1=t;t=r0;r0=r1;r1=t;t=g0;g0=g1;g1=t;t=b0;b0=b1;b1=t}
      /* Each pixel goes to the nearest of the four colours on the line from
       * c1 (d = 0) to c0 (d = 1): codes 0 = c0, 1 = c1, 2 = 2/3 c0, 3 = 1/3 c0.
       * One byte of indices per row, two bits per pixel. */
      var dr=r1-r0,dg=g1-g0,db=b1-b0,len=dr*dr+dg*dg+db*db||1;
      for(y=0;y<4;y++){i=((by*4+y)*W+bx*4)*4;var row=0;for(x=0;x<4;x++,i+=4){
        var d=((px[i]-r0)*dr+(px[i+1]-g0)*dg+(px[i+2]-b0)*db)/len;
        row|=(d>0.8333?0:d>0.5?2:d>0.1667?3:1)<<(x*2)}

  for(var i=0;i<n;i++){var len=Math.min(131072,d.length-p),h=(len<<3)|(i===n-1?1:0);
