.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
button,input{font:inherit;color:inherit}
.grad{background:linear-gradient(100deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}

header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:46px;height:46px;flex:none;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,255,255,.22))}

.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(15,21,37,.7);font-weight:650;font-size:13px;white-space:nowrap}

.chip.ok{border-color:rgba(52,211,153,.5)} .chip.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.chip.bad{border-color:rgba(248,113,113,.5)} .chip.bad i{background:var(--bad)}

nav.tabs{display:flex;gap:6px;padding:5px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r);
  background:rgba(15,21,37,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:10px;z-index:10}
nav.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;border:0;background:transparent;cursor:pointer;
  padding:11px 10px;border-radius:10px;font-weight:680;color:var(--dim);transition:background .15s,color .15s;min-width:0}
nav.tabs button svg{width:18px;height:18px;flex:none}
nav.tabs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button em{font:700 11px var(--mono);font-style:normal;padding:2px 7px;border-radius:999px;background:rgba(160,166,180,.14);color:var(--dim)}
nav.tabs button:hover{color:var(--text);background:rgba(160,166,180,.08)}
nav.tabs button.on{color:var(--text);background:linear-gradient(100deg,rgba(226,230,240,.22),rgba(139,147,167,.22));box-shadow:inset 0 0 0 1px rgba(226,230,240,.35)}
nav.tabs button.on em{background:rgba(226,230,240,.25);color:var(--text)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{padding:20px;position:relative;overflow:hidden;border-color:rgba(226,230,240,.3)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:radial-gradient(520px 220px at 0 0,rgba(226,230,240,.2),transparent 70%),
             radial-gradient(520px 240px at 100% 100%,rgba(139,147,167,.18),transparent 70%)}
.hero>*{position:relative}
.hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;
  filter:blur(34px) saturate(1.3);opacity:0;transition:opacity .5s}
.id h1{margin:0;font-size:25px;letter-spacing:-.025em;font-weight:780}
.id p{margin:3px 0 0;font:500 12.5px var(--mono);color:var(--dim)}
.id p b{color:var(--text);font-weight:600}
.now{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.now img,.now .ph{width:104px;height:104px;border-radius:12px;flex:none;object-fit:cover;background:#070A12;border:1px solid var(--line2)}
.now .ph{display:grid;place-items:center;color:var(--faint)}
.now .t{min-width:0;flex:1}
.kick{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ok)}
.kick.idle{color:var(--faint)}
.now h2{margin:4px 0 2px;font-size:clamp(20px,3.4vw,30px);line-height:1.08;letter-spacing:-.03em;font-weight:800;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now span{font:500 12.5px var(--mono);color:var(--dim)}
.btn{border:1px solid var(--line2);background:rgba(15,21,37,.75);border-radius:10px;padding:10px 16px;
  font-weight:650;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);background:rgba(226,230,240,.12)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn.pri{border:0;color:#06101F;background:linear-gradient(100deg,var(--blue),var(--violet))}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(248,113,113,.55);color:#FCA5A5}
.btn.danger:hover{background:rgba(248,113,113,.14);border-color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}

.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}
.sec{padding:18px}
h3.h{margin:0 0 14px;font:700 11.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:9px}
h3.h::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(var(--blue),var(--violet))}
h3.h em{font-style:normal;color:var(--faint)}
.gauges{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap}
.g{position:relative;width:132px;text-align:center}
.g svg{width:132px;height:108px;display:block}
.g .trk{fill:none;stroke:rgba(160,166,180,.14);stroke-width:9;stroke-linecap:round}
.g .arc{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1),stroke .4s}
.g .v{position:absolute;left:0;right:0;top:44px;font-size:30px;font-weight:780;letter-spacing:-.03em}
.g .v small{font:600 12px var(--mono);color:var(--dim);margin-left:2px}
.g .l{font:700 11px var(--mono);letter-spacing:.16em;color:var(--dim);margin-top:-4px}
.spark{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.spark .lg{display:flex;justify-content:space-between;font:500 11.5px var(--mono);color:var(--faint);margin-bottom:6px}
.spark .lg b{font-weight:600;color:var(--dim)} .spark .lg b::before{content:"";display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.spark svg{width:100%;height:74px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-bottom:16px}
.stat b{display:block;font-size:22px;font-weight:760;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b small{font:600 11px var(--mono);color:var(--dim);margin-left:3px}
.stat span{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.disk{margin-top:13px}
.disk .r{display:flex;justify-content:space-between;font-weight:650}
.disk .r em{font:600 12px var(--mono);font-style:normal;color:var(--dim)}
.bar{height:6px;border-radius:4px;background:rgba(160,166,180,.14);margin:7px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .6s}
.bar i.hot{background:linear-gradient(90deg,var(--warn),var(--bad))}
.disk small{font:500 11.5px var(--mono);color:var(--faint)}

.bar-h{display:flex;align-items:center;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.bar-h h3.h{margin:0}.bar-h .sp{flex:1}
.in{background:rgba(15,21,37,.75);border:1px solid var(--line2);border-radius:10px;padding:9px 13px;min-width:0;width:210px;outline:none}
.in:focus{border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-weight:620;color:var(--dim)}
.seg button.on{background:rgba(226,230,240,.16);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
.game{min-width:0}
.cover{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#070A12;border:1px solid var(--line);
  transition:transform .18s,border-color .18s,box-shadow .18s}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--mono);color:var(--faint);letter-spacing:.06em}
.cover .go{position:absolute;inset:auto 0 0 0;padding:26px 10px 10px;display:flex;justify-content:center;

.game:hover .cover,.game:focus-within .cover{transform:translateY(-3px);border-color:rgba(226,230,240,.6);box-shadow:0 14px 34px -14px rgba(226,230,240,.55)}
.game:hover .go,.game:focus-within .go{opacity:1;transform:none}
.game.run .cover{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 12px 34px -12px rgba(52,211,153,.6)}
.tag{position:absolute;left:8px;bottom:8px;padding:4px 9px;border-radius:7px;background:var(--ok);color:#04130D;font:800 10.5px var(--mono);letter-spacing:.1em}
.game b{display:block;margin-top:9px;font-weight:680;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.game i{font:500 11.5px var(--mono);font-style:normal;color:var(--faint)}
.empty{padding:34px;text-align:center;color:var(--dim)}

.drop{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:var(--r);
  background:rgba(15,21,37,.5);transition:border-color .15s,background .15s;margin-bottom:14px}
.drop.over{border-color:var(--blue);background:rgba(226,230,240,.1)}

.note{padding:11px 15px;border-radius:11px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:#FDE68A;margin-bottom:14px;font-size:14px}
.plist{overflow:hidden}
.prow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:rgba(160,166,180,.3)}
.prow.run .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
.pmain{flex:1;min-width:0}
.pmain b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmain span{font:500 12px var(--mono);color:var(--faint)}
.badge{display:inline-block;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:2px;
  border:1px solid var(--line2);color:var(--dim)}
.badge.ok{border-color:rgba(52,211,153,.5);color:var(--ok)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:36px;height:20px;border-radius:999px;background:rgba(160,166,180,.22);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#C9D3EE;transition:transform .15s}
.sw input:checked+i{background:linear-gradient(100deg,var(--blue),var(--violet))}
.sw input:checked+i::after{transform:translateX(16px);background:#fff}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.pact{display:flex;gap:8px;flex:none}
footer{margin-top:34px;text-align:center;font:500 11.5px var(--mono);color:var(--faint)}
footer a{color:var(--dim)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.25s;z-index:30;
  padding:11px 18px;border-radius:12px;background:rgba(15,21,37,.96);border:1px solid var(--line2);font-weight:620;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.err{border-color:var(--bad);color:#FCA5A5}
dialog{border:1px solid var(--line2);border-radius:16px;background:#0F1525;color:var(--text);padding:22px;max-width:min(420px,92vw)}
dialog::backdrop{background:rgba(4,6,12,.72);backdrop-filter:blur(4px)}
dialog h4{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
dialog p{margin:0 0 18px;color:var(--dim)}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
@media (max-width:640px){
  .prow{flex-wrap:wrap}.pmain{flex-basis:calc(100% - 24px)}.pact{margin-left:24px}.sw{margin-left:24px}

}

  nopay:"No hay payloads en la consola todavía.",ro:"NeoWEB está en modo de solo lectura: existe el fichero /data/neohen/web/readonly en la consola. Bórralo para poder gestionar payloads desde aquí."}
:{tconsole:"Console",tlibrary:"Library",temp:"Temperature",system:"System",uptime:"Uptime",clock:"CPU clock",games:"Games",
  installed:"Installed",on:"Connected",off:"Offline",playing:"Now playing",idle:"Nothing open",idlet:"No game running",
  close:"Close game",launch:"Launch",running:"RUNNING",search:"Search games…",fgames:"Games",fall:"All",
  none:"Nothing to show.",last:"Last minutes",free:"free of",cancel:"Cancel",
  qclose:"Close the game",qclosep:"Anything unsaved is lost.",
  qlaunch:"Launch ",qlaunchp:"Another game is open and the console will close it. Anything unsaved is lost.",
  launching:"Launching ",closing:"Closing the game…",done:"Done",ssd:"Internal SSD",usb:"USB drive",usb2:"USB drive 2",ext:"Extended storage",m2:"M.2 SSD",
  foot:"NeoHEN remote service",
  uph:"Send a payload",ups:"Drop an .elf or .bin here, or pick a file. It is saved on the console.",pick:"Choose file",
  uping:"Sending ",upok:" saved on the console",badfile:"Only .elf or .bin files",
  start:"Start",stop:"Stop",del:"Delete",auto:"On boot",prun:"running",pstop:"stopped",bundled:"NeoHEN's",thisone:"this service",
  starting:"Starting ",started:" started",ranonce:" sent to the loader; it left no process running",
  stopped:" stopped",deleted:" deleted",
  qstop:"Stop ",qstopp:"The process is closed at once. If the console relies on it, like ShadowMount+, it stops doing its job until you start it again.",
  qdel:"Delete ",qdelp:"The file is removed from the console. This cannot be undone.",
  nopay:"No payloads on the console yet.",ro:"NeoWEB is read-only: the file /data/neohen/web/readonly exists on the console. Delete it to manage payloads from here."};
var $=function(id){return document.getElementById(id)};
document.documentElement.lang=ES?"es":"en";
[].forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=T[e.getAttribute("data-t")]});
$("q").placeholder=T.search;$("f-games").textContent=T.fgames;$("f-all").textContent=T.fall;
$("close").textContent=T.close;$("dno").textContent=T.cancel;$("foot").textContent=T.foot;$("sp-l").textContent=T.last;
$("up-h").textContent=T.uph;$("up-s").textContent=T.ups;$("pick").textContent=T.pick;$("ro").textContent=T.ro;

var UTIL=/^(NPXS|APDU|APRE|ORBT|PLDM|FAKE|WKAL|MOUU|PPSA99)/;
var apps=[],running=null,hist=[],filter="games",ARC=245,tab="console",readOnly=false,busy=false;
["a-cpu","a-soc"].forEach(function(id){var p=$(id);p.style.strokeDasharray=ARC;p.style.strokeDashoffset=ARC});

function api(path,body){
  var o=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  return fetch(path,o).then(function(r){return r.json().then(function(j){
    if(!r.ok||j.ok===false)throw new Error(j.error||("HTTP "+r.status));return j})});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dur(s){s=Math.max(0,s|0);var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?d+" d "+h+" h":h?h+" h "+m+" min":m+" min"}
function num(v,d){return v.toFixed(d).replace(".",ES?",":".")}
function size(b){return b>=1e12?num(b/1e12,2)+" TB":b>=1e9?Math.round(b/1e9)+" GB":b>=1048576?num(b/1048576,1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function toast(msg,err){var t=$("toast");t.textContent=msg;t.className="toast on"+(err?" err":"");
  clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},err?5600:2800)}
function ask(title,text,yes,danger){return new Promise(function(res){
  var d=$("dlg");$("dh").textContent=title;$("dp").textContent=text;$("dyes").textContent=yes;
  $("dyes").className="btn "+(danger?"danger":"pri");
  function end(v){d.close();$("dyes").onclick=$("dno").onclick=d.oncancel=null;res(v)}
  $("dyes").onclick=function(){end(true)};$("dno").onclick=function(){end(false)};d.oncancel=function(){res(false)};
  d.showModal()})}
function online(v){$("chip").className="chip "+(v?"ok":"bad");$("chipt").textContent=v?T.on:T.off}
function title(id){for(var i=0;i<apps.length;i++)if(apps[i].titleId===id)return apps[i].title||id;return id}

/* ---------------------------------------------------------------- tabs */
function show(t,push){
  if(!$("tab-"+t))t="console";tab=t;
  [].forEach.call(document.querySelectorAll("nav.tabs button"),function(b){
    var on=b.getAttribute("data-tab")===t;b.className=on?"on":"";b.setAttribute("aria-selected",on)});
  ["console","library","payloads"].forEach(function(x){$("tab-"+x).hidden=x!==t});
  if(push)history.replaceState(null,"","#"+t);
  if(t==="payloads")payloads();
}
[].forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.onclick=function(){show(b.getAttribute("data-tab"),true)}});
window.addEventListener("hashchange",function(){show(location.hash.slice(1))});

/* ---------------------------------------------------------------- console */
function tempColor(v){return v>=88?"var(--bad)":v>=78?"var(--warn)":"var(--ok)"}
function gauge(k,v){var p=$("a-"+k),ok=typeof v==="number"&&v>0;
  $("v-"+k).textContent=ok?v:"–";
  p.style.strokeDashoffset=ok?ARC*(1-Math.min(1,Math.max(0,(v-25)/75))):ARC;p.style.stroke=ok?tempColor(v):"transparent"}
function spark(){
  var s=$("spark"),n=hist.length;if(n<2){s.innerHTML="";$("sp-r").textContent="";return}
  var lo=1e9,hi=-1e9;hist.forEach(function(h){[h[0],h[1]].forEach(function(v){if(v>0){lo=Math.min(lo,v);hi=Math.max(hi,v)}})});
  if(hi<lo)return;var a=lo-3,b=hi+3;
  function line(i){return hist.map(function(h,x){return (x/(n-1)*600).toFixed(1)+","+(70-(h[i]-a)/(b-a)*66).toFixed(1)}).join(" ")}
  var c=line(0);
  s.innerHTML='<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F8" stop-opacity=".28"/><stop offset="1" stop-color="#F2F4F8" stop-opacity="0"/></linearGradient></defs>'+
    '<polygon fill="url(#sg)" points="0,74 '+c+' 600,74"/>'+
    '<polyline fill="none" stroke="#8B93A7" stroke-width="1.6" stroke-dasharray="3 4" vector-effect="non-scaling-stroke" points="'+line(1)+'"/>'+
    '<polyline fill="none" stroke="#F2F4F8" stroke-width="2" vector-effect="non-scaling-stroke" points="'+c+'"/>';
  $("sp-r").textContent=lo+"–"+hi+" °C"}
function paintNow(){
  var img=$("nowimg"),ph=$("nowph");
  if(running){
    $("kick").textContent=T.playing;$("kick").className="kick";
    $("nowt").textContent=title(running);$("nows").textContent=running;
    img.src="/apps/icon?id="+running;img.hidden=false;ph.hidden=true;
    $("herobg").style.backgroundImage='url("/apps/icon?id='+running+'")';$("herobg").style.opacity=".22";
    $("close").hidden=false;
  }else{
    $("kick").textContent=T.idle;$("kick").className="kick idle";
    $("nowt").textContent=T.idlet;$("nows").textContent="";
    img.hidden=true;ph.hidden=false;$("herobg").style.opacity="0";$("close").hidden=true;
  }
}
function paintDisks(m){
  var names={"/user":T.ssd,"/mnt/usb0":T.usb,"/mnt/usb1":T.usb2,"/mnt/ext0":T.ext,"/mnt/ext1":T.m2};
  $("disks").innerHTML=(m||[]).filter(function(d){return names[d.path]&&d.total}).map(function(d){
    var pct=Math.round((d.total-d.free)/d.total*100);
    return '<div class="disk"><div class="r"><span>'+names[d.path]+'</span><em>'+pct+' %</em></div>'+
      '<div class="bar"><i class="'+(pct>=85?"hot":"")+'" style="width:'+pct+'%"></i></div>'+
      '<small>'+size(d.free)+" "+T.free+" "+size(d.total)+'</small></div>'}).join("")}

/* ---------------------------------------------------------------- library */
function paintGrid(){
  var q=$("q").value.trim().toLowerCase();
  var list=apps.filter(function(a){
    if(filter==="games"&&UTIL.test(a.titleId))return false;
    if(filter==="all"&&/^NPXS/.test(a.titleId))return false;
    return !q||(a.title||"").toLowerCase().indexOf(q)>=0||a.titleId.toLowerCase().indexOf(q)>=0});
  list.sort(function(a,b){return (b.titleId===running)-(a.titleId===running)||(a.title||"").localeCompare(b.title||"")});
  $("count").textContent=list.length;
  $("grid").innerHTML=list.length?list.map(function(a){
    var run=a.titleId===running;
    return '<div class="game'+(run?" run":"")+'"><div class="cover">'+
      (a.hasIcon?'<img loading="lazy" alt="" src="/apps/icon?id='+esc(a.titleId)+'">':'<div class="ph">'+esc(a.titleId)+'</div>')+
      (run?'<div class="tag">'+T.running+'</div>':'<div class="go"><button class="btn pri" data-id="'+esc(a.titleId)+'">'+T.launch+'</button></div>')+
      '</div><b title="'+esc(a.title)+'">'+esc(a.title||a.titleId)+'</b><i>'+esc(a.titleId)+(a.version?" · v"+esc(a.version.replace(/^0/,"")):"")+'</i></div>'
  }).join(""):'<div class="empty">'+T.none+'</div>';
}

/* ---------------------------------------------------------------- payloads */
function payloads(){
  return api("/api/payloads/list").then(function(j){
    var list=j.payloads||[];readOnly=!!j.readOnly;
    $("ro").hidden=!readOnly;$("pick").disabled=readOnly;$("pdir").textContent=j.dir||"";
    $("n-pay").textContent=list.length?list.filter(function(p){return p.running}).length+"/"+list.length:"";
    if(busy)return;
    var dis=readOnly?" disabled":"";
    $("plist").innerHTML=list.length?list.map(function(p){
      var n=esc(p.name);
      return '<div class="prow'+(p.running?" run":"")+'"><i class="dot"></i>'+
        '<div class="pmain"><b title="'+n+'">'+n+(p.bundled?'<span class="badge">'+T.bundled+'</span>':"")+(p.self?'<span class="badge ok">'+T.thisone+'</span>':"")+'</b>'+
        '<span>'+size(p.size)+" · "+(p.running?T.prun+" · pid "+p.pid:T.pstop)+'</span></div>'+
        '<label class="sw"><input type="checkbox" data-auto="'+n+'"'+(p.autoStart?" checked":"")+dis+'><i></i>'+T.auto+'</label>'+
        '<div class="pact">'+
        (p.running?'<button class="btn sm danger" data-stop="'+n+'"'+(p.self?" disabled":dis)+'>'+T.stop+'</button>'
                  :'<button class="btn sm pri" data-start="'+n+'"'+dis+'>'+T.start+'</button>')+
        '<button class="btn sm" data-del="'+n+'"'+(p.running?" disabled":dis)+'>'+T.del+'</button></div></div>'
    }).join(""):'<div class="empty">'+T.nopay+'</div>';
  }).catch(function(){});
}
function pact(path,body,before,after){
  toast(before);busy=true;
  return api(path,body).then(function(j){busy=false;toast(typeof after==="function"?after(j):after);return payloads()})
    .catch(function(e){busy=false;toast(e.message,true);return payloads()});
}
$("plist").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;var n;
  if((n=b.getAttribute("data-start")))
    pact("/api/payloads/start",{name:n},T.starting+n+"…",function(j){return n+(j.running?T.started:T.ranonce)});
  else if((n=b.getAttribute("data-stop")))
    ask(T.qstop+n,T.qstopp,T.stop,true).then(function(ok){if(ok)pact("/api/payloads/stop",{name:n},"…",n+T.stopped)});
  else if((n=b.getAttribute("data-del")))
    ask(T.qdel+n,T.qdelp,T.del,true).then(function(ok){if(ok)pact("/api/payloads/delete",{name:n},"…",n+T.deleted)});
});
$("plist").addEventListener("change",function(e){
  var n=e.target.getAttribute("data-auto");if(!n)return;
  pact("/api/payloads/autostart",{name:n,enabled:e.target.checked},"…",T.done);
});
function upload(files){
  var list=[].filter.call(files,function(f){return /\.(elf|bin)$/i.test(f.name)});
  if(!list.length){if(files.length)toast(T.badfile,true);return}
  var bar=$("prog"),fill=bar.firstChild,i=0;
  (function next(){
    if(i>=list.length){bar.hidden=true;$("up-s").textContent=T.ups;payloads();return}
    var f=list[i++],name=f.name.replace(/[^A-Za-z0-9._+-]/g,"_"),x=new XMLHttpRequest();
    $("up-s").textContent=T.uping+name+"…";bar.hidden=false;fill.style.width="0";
    x.open("PUT","/api/payloads/upload?name="+encodeURIComponent(name));
    x.upload.onprogress=function(e){if(e.lengthComputable)fill.style.width=Math.round(e.loaded/e.total*100)+"%"};
    x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(_){}
      if(x.status===200&&j.ok!==false)toast(name+T.upok);else toast(j.error||("HTTP "+x.status),true);next()};
    x.onerror=function(){toast(T.off,true);next()};
    x.send(f);
  })();
}
$("pick").onclick=function(){$("file").click()};
$("file").onchange=function(){upload(this.files);this.value=""};
var drop=$("drop");
["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();if(!readOnly)drop.className="drop over"})});
["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.className="drop"})});
drop.addEventListener("drop",function(e){if(!readOnly&&e.dataTransfer)upload(e.dataTransfer.files)});

/* ---------------------------------------------------------------- data */
function fast(){
  return api("/api/sys/info").then(function(i){
    online(true);
    $("meta").innerHTML=[i.model&&"<b>"+esc(i.model)+"</b>",i.firmware&&"FW "+esc(i.firmware),
      (i.ips&&i.ips[0]&&esc(i.ips[0].ip))].filter(Boolean).join(" &nbsp;·&nbsp; ");
    $("ver").textContent="NeoHEN · v"+(i.version||"");
    gauge("cpu",i.cpuTemp);gauge("soc",i.socTemp);
    if(i.cpuTemp>0||i.socTemp>0){hist.push([i.cpuTemp|0,i.socTemp|0]);if(hist.length>120)hist.shift();spark()}
    $("s-up").textContent=i.uptime?dur(i.uptime):"–";
    $("s-clk").innerHTML=i.cpuFreqMhz>0?num(i.cpuFreqMhz/1000,1)+"<small>GHz</small>":"–";
    var r=i.running&&i.running.titleId||null;
    if(r!==running){running=r;paintNow();paintGrid()}
  }).catch(function(){online(false)});
}
function slow(){
  return Promise.all([api("/api/apps/list"),api("/api/sys/mounts")]).then(function(x){
    apps=x[0].apps||[];paintDisks(x[1].mounts);
    var n=apps.filter(function(a){return !UTIL.test(a.titleId)}).length;
    $("s-n").textContent=n;$("n-lib").textContent=n;
    paintNow();paintGrid();
  }).catch(function(){});
}
function act(p,body,msg){
  toast(msg);
  return api(p,body).then(function(){toast(T.done);setTimeout(fast,1500);setTimeout(fast,5000)})
    .catch(function(e){toast(e.message,true)});
}
$("grid").addEventListener("click",function(e){
  var b=e.target.closest("button[data-id]");if(!b)return;var id=b.getAttribute("data-id"),n=title(id);
  (running?ask(T.qlaunch+n,T.qlaunchp,T.launch):Promise.resolve(true)).then(function(ok){
    if(ok)act("/api/apps/launch",{titleId:id},T.launching+n+"…")});
});
$("close").onclick=function(){ask(T.qclose,T.qclosep,T.close,true).then(function(ok){if(ok)act("/api/apps/kill",{},T.closing)})};
$("q").oninput=paintGrid;
$("f-games").onclick=function(){filter="games";this.className="on";$("f-all").className="";paintGrid()};
$("f-all").onclick=function(){filter="all";this.className="on";$("f-games").className="";paintGrid()};

show(location.hash.slice(1));paintNow();fast().then(slow);payloads();
setInterval(function(){if(document.hidden)return;fast();if(tab==="payloads")payloads()},5000);
setInterval(function(){if(!document.hidden){slow();payloads()}},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){fast();slow();payloads()}});
})();
</script>
</body>
